<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kalkulator ponuda za PVC i ALU stolariju: crtež pozicije, statika, cenovnik i PDF ponuda za kupca. Demo verzija.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kalkulator stolarije · demo">
<meta property="og:description" content="Ponuda sa crtežom i PDF-om za kupca za nekoliko minuta. Probajte demo verziju.">
<meta property="og:url" content="https://dusanstoiljkovic.com/kalkulator/">
<meta property="og:image" content="https://dusanstoiljkovic.com/kalkulator/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalkulator stolarije</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
</head>
<body style="margin:0">
<style>
/* Pravac C: svetla zelenkasta podloga, bele kartice velikog radijusa, tamno zeleno mastilo, akcent limeta; ceo program u Bricolage Grotesque */
:root{
  --bg:#EDF1E8; --surface:#FFFFFF; --surface2:#F4F7F0; --surface3:#F1F4EC; --chip:#E3E9DD; --chip2:#D8E0D1;
  --line:#E3E9DD; --line2:#DCE3D6; --line3:#C4CEBD; --hover:#F8FAF5;
  --ink:#142019; --ink2:#3E4C43; --ink3:#56645B; --ink4:#9AA59D;
  --dk:#142019; --dk2:#25382C; --dk-ink:#F4F7F0; --dk-mute:#B7C7BB; --dk-line:#3E5446;
  --hero:#142019; --hero-deco:#1F3A2A; --hero-ink:#F4F7F0;
  --paper:#F6F8F3; --paper-dot:#CFD8C9;
  --ok:#2E7D32; --ok-soft:#E4F2DD; --warn:#7A4300; --warn-soft:#FFF1D6; --bad:#A63A1C; --bad-soft:#FCE6DE; --info:#3F7BE0; --info-soft:#E3EDFB;
  --focus:#6E9420;
  --acc:#C6EF5E; --acc-ink:#142019; --acc-soft:rgba(198,239,94,.22); --acc-t:#1C4A30;
  --accent:var(--acc); --accent-soft:var(--acc-soft); --accent-t:var(--acc-t); --accent-ink:var(--acc-ink);
  --shadow:0 1px 0 rgba(20,32,25,.06); --shadow-lg:0 12px 30px rgba(20,32,25,.22);
  --f-body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:var(--f-body); --f-mono:var(--f-body);
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D130F; --surface:#162019; --surface2:#1C281F; --surface3:#1A251D; --chip:#24332A; --chip2:#2C3D32;
  --line:#25332A; --line2:#2E3E34; --line3:#3B4D41; --hover:#1B271E;
  --ink:#E8EFE4; --ink2:#BCC9BF; --ink3:#93A398; --ink4:#6E7D72;
  --dk:#E8EFE4; --dk2:#CFDACB; --dk-ink:#142019; --dk-mute:#3E4C43; --dk-line:#93A398;
  --hero:#1A2A20; --hero-deco:#22382A; --hero-ink:#F4F7F0;
  --paper:#F2F5EE; --paper-dot:#CFD8C9;
  --ok:#7FCB72; --ok-soft:#173022; --warn:#F2BE62; --warn-soft:#33270F; --bad:#F2896E; --bad-soft:#3A1A12; --info:#8FB3F0; --info-soft:#18243A;
  --focus:var(--acc-t-dk,#C6EF5E); --acc-t:var(--acc-t-dk,#C6EF5E); --shadow:0 1px 0 rgba(0,0,0,.3); --shadow-lg:0 12px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D130F; --surface:#162019; --surface2:#1C281F; --surface3:#1A251D; --chip:#24332A; --chip2:#2C3D32;
  --line:#25332A; --line2:#2E3E34; --line3:#3B4D41; --hover:#1B271E;
  --ink:#E8EFE4; --ink2:#BCC9BF; --ink3:#93A398; --ink4:#6E7D72;
  --dk:#E8EFE4; --dk2:#CFDACB; --dk-ink:#142019; --dk-mute:#3E4C43; --dk-line:#93A398;
  --hero:#1A2A20; --hero-deco:#22382A; --hero-ink:#F4F7F0;
  --paper:#F2F5EE; --paper-dot:#CFD8C9;
  --ok:#7FCB72; --ok-soft:#173022; --warn:#F2BE62; --warn-soft:#33270F; --bad:#F2896E; --bad-soft:#3A1A12; --info:#8FB3F0; --info-soft:#18243A;
  --focus:var(--acc-t-dk,#C6EF5E); --acc-t:var(--acc-t-dk,#C6EF5E); --shadow:0 1px 0 rgba(0,0,0,.3); --shadow-lg:0 12px 30px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--f-display)}
a{color:var(--acc-t)}
.mono,.num-t{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* okvir aplikacije i gornja navigacija */
.shell{min-height:100vh;padding:16px max(22px,env(safe-area-inset-right,0px)) 64px max(22px,env(safe-area-inset-left,0px))}
.shell-in{max-width:1580px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;background:var(--surface);border-radius:999px;padding:7px 8px 7px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark,.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-name{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.nav,.navc{display:flex;gap:4px;flex-wrap:wrap}
.nav button{height:40px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--ink2);font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button.on{background:var(--dk);color:var(--dk-ink)}
.nav button svg{display:none}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-r .hint{white-space:nowrap}
.save-dot{width:8px;height:8px;border-radius:50%;background:#5FA832;flex:none}
.save-dot.fail{background:var(--bad)}
.theme-btn{width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:var(--ink2);display:inline-grid;place-items:center}
.theme-btn:hover{background:var(--bg);color:var(--ink)}
.theme-btn .lbl-t{display:none}
@media (max-width:899px){
  .topnav{border-radius:24px;padding:8px}
  .nav{order:3;width:100%;justify-content:space-between;gap:2px}
  .nav button{flex:1 1 0;padding:0 6px;justify-content:center;font-size:13.5px}
  .top-r .hint{display:none}
  .brand-sub{max-width:140px}
}
@media (max-width:420px){.top-r .cta .lbl-t{display:none}.top-r .cta{width:40px;padding:0}}

/* opšte */
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.h1{margin:0;font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
.h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sub-t{font-size:14px;color:var(--ink2);margin-top:4px}
.muted,.hint{color:var(--ink3)}
.hint{font-size:12.5px}
.card{background:var(--surface);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px}
.card-h .hint{font-weight:600}
.card-b{padding:4px 20px 20px}
.btn{height:44px;padding:0 18px;border-radius:14px;border:0;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.primary,.btn-dark{background:var(--dk);color:var(--dk-ink);box-shadow:none}
.btn.primary:hover,.btn-dark:hover{background:var(--dk2);box-shadow:none}
.btn-acc{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.btn-acc:hover{filter:brightness(1.06);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.lg{height:52px;padding:0 24px;font-size:16px;border-radius:16px}
.btn.pill-b{border-radius:999px}
.btn.dashed{width:100%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line3)}
.btn.dashed:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.linkbtn{border:0;background:transparent;padding:0;font-weight:700;color:inherit;text-align:left;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.ibtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink3);display:inline-grid;place-items:center;flex:none}
.ibtn:hover{background:var(--bg);color:var(--ink)}
.ibtn:disabled{opacity:.3;cursor:not-allowed;background:transparent}
.ibtn.warn:hover,.ibtn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:13.5px;font-weight:700;display:block;color:var(--ink)}
.field>.lbl{margin:0}
.fhint{font-size:12.5px;color:var(--ink3)}
.ferr{font-size:12.5px;color:var(--bad);font-weight:600}
input.inp,select.sel,textarea.ta,.inp-w{width:100%;min-width:0;height:44px;border:0;border-radius:12px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line2);padding:0 12px;font-size:15px;color:var(--ink)}
textarea.ta{height:auto;min-height:84px;padding:12px;resize:vertical;line-height:1.5}
input.inp:focus,select.sel:focus,textarea.ta:focus{outline:0;background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.inp::placeholder,.ta::placeholder{color:var(--ink3);opacity:.85}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px 16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.numbox{height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line2)}
.numbox:focus-within{box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface)}
.numbox.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.numbox input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:15px;font-weight:600;padding:0 12px;color:var(--ink);-moz-appearance:textfield}
.numbox input:focus-visible{outline:0}
.numbox.center input{text-align:center;padding:0 4px}
.numbox input::-webkit-outer-spin-button,.numbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numbox .suf{padding:0 12px;color:var(--ink3);font-size:13px;height:100%;display:flex;align-items:center;flex:none}
.numbox .stp{width:38px;height:100%;border:0;background:transparent;color:var(--ink);font-size:18px;line-height:1;flex:none}
.numbox .stp:hover{background:var(--chip)}
.numbox .stp + input{text-align:center;padding:0 4px}
.numbox .stp ~ .suf{padding-left:4px}
.pills,.opts{display:flex;flex-wrap:wrap;gap:8px}
.pill,.opt{min-height:42px;padding:0 14px;border:0;border-radius:12px;background:var(--surface3);font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1.5px var(--line2);text-align:left;line-height:1.2}
.pill:hover,.opt:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill:disabled,.opt:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 0 0 1.5px var(--line2)}
.pill.on,.opt.on{background:var(--dk);color:var(--dk-ink);box-shadow:none}
.pill .hint,.pr{font-size:12px;font-weight:500;color:var(--ink3);white-space:nowrap}
.pill.on .hint,.opt.on .pr{color:var(--dk-mute)}
.pill.sq,.opt.sq{width:48px;justify-content:center;padding:0}
.opt-grid .opt{min-height:44px}
.opt-grid .opt .t{min-width:0}
.opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt-grid .opt{justify-content:space-between}
.seg{display:inline-flex;padding:4px;background:var(--chip);border-radius:14px;gap:2px;flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,32,25,.14)}
.chk{display:flex;align-items:center;gap:12px;min-height:42px;cursor:pointer;font-size:14.5px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--dk);margin:0;flex:none}
.chk .hint{margin-left:auto;font-size:12px;font-weight:500;white-space:nowrap}
.choice,.opt-card{width:100%;text-align:left;padding:12px 14px;border:0;border-radius:14px;background:var(--surface3);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.choice:hover,.opt-card:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.choice.on,.opt-card.on{background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--ink)}
.choice .t{font-size:14.5px;font-weight:700}
.choice .s{font-size:12.5px;color:var(--ink3);margin-top:1px}
.choice .pz{font-size:13.5px;font-weight:700;white-space:nowrap}
.choices{display:flex;flex-direction:column;gap:8px}
.sw-i{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none;display:inline-block}
.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.swatches .choice{padding:10px;justify-content:flex-start}
.status-dot,.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.stsel-w{display:inline-flex;align-items:center;background:var(--surface3);border-radius:999px;padding-left:12px}
.stsel{height:34px;border-radius:999px;border:0;padding:0 12px;font-size:13px;font-weight:700;color:var(--ink);background:transparent}
.stsel:focus{outline:0}
.tagc{height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.cnt.bad{background:var(--bad);color:#fff}
.chip{height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip.on{background:var(--dk);color:var(--dk-ink)}
.chip .n{font-weight:500;opacity:.75}
.divider{height:1.5px;background:var(--line)}
.empty{padding:18px 12px;text-align:center;font-size:13.5px;color:var(--ink3);border-radius:14px;border:1.5px dashed var(--line3)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.note{font-size:13.5px;color:var(--ink2);background:var(--surface2);border-radius:14px;padding:12px 14px}

/* početna */
.home-top{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.hero{flex:999 1 560px;min-width:0;background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:36px 36px 32px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.hero-deco{position:absolute;right:-60px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:var(--hero-deco)}
.hero > :not(.hero-deco){position:relative}
.hero .greet{font-size:14px;color:#B7C7BB}
.hero h1{text-wrap:wrap;margin:0;font-size:48px;line-height:1.02;font-weight:800;letter-spacing:-.035em;max-width:640px}
.hero-form{display:flex;gap:10px;flex-wrap:wrap;max-width:660px}
.hero-form input{flex:1 1 260px;min-width:0;height:56px;border-radius:16px;border:0;background:#FFFFFF;color:#142019;font-size:17px;padding:0 20px;outline:none}
.hero-form input::placeholder{color:#7A877E}
.hero-form .btn{height:56px;padding:0 26px;border-radius:16px;font-size:16px}
.hero-last{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:#B7C7BB;align-items:center}
.hero-last .linkbtn{color:var(--acc)}
.kpis{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px}
.kpi{flex:1;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.kpi .k{font-size:13px;color:var(--ink2)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em}
.kpi .d{font-size:13px;color:var(--ink2)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.025em}
.sec-h .linkbtn{color:var(--acc-t)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px;align-items:start}
.col{background:var(--chip);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 2px;gap:8px}
.col-h .t{display:flex;align-items:center;gap:8px;font-weight:800}
.col-h .s{font-size:13px;color:var(--ink2);font-weight:700}
.qc{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;color:inherit;box-shadow:var(--shadow);border:0;text-align:left;width:100%;font-size:inherit}
.qc:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.qc .top{display:flex;gap:12px;align-items:center;width:100%}
.qc .nm{font-weight:700;line-height:1.25}
.qc .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.qc .val{font-size:19px;font-weight:800;letter-spacing:-.02em}
.thumb{width:60px;height:60px;flex:none;border-radius:10px;background:var(--paper);display:grid;place-items:center;padding:3px;overflow:hidden;color:var(--ink3)}
.thumb svg{width:100%;height:100%}
.qc .thumb{width:52px;height:52px}

/* lista ponuda */
.list-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{width:300px;max-width:100%;height:44px;border-radius:999px;background:var(--surface);display:flex;align-items:center;box-shadow:inset 0 0 0 1.5px var(--line2)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.search svg{margin-left:14px;flex:none;color:var(--ink3)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;padding:0 14px 0 10px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:700;color:var(--ink3);text-align:left;padding:12px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1.5px solid var(--surface3);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.click:hover td{background:var(--hover);cursor:pointer}

.tbl input.inp,.tbl select.sel{height:40px}

/* editor */

.crumbs{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.crumbs .linkbtn{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.ed-name{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ed-name .h1{font-size:34px}
.ed-meta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.ed-meta .lock{display:inline-flex;align-items:center;gap:6px}
.ed-meta .linkbtn{color:var(--acc-t);text-decoration:underline}
.status-pill{display:inline-flex;align-items:center;background:var(--surface);border-radius:999px;padding-left:14px}
.status-pill .stsel{background:transparent;height:38px;font-size:14px}
.ed-tot{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.total-box{display:flex;flex-direction:column;align-items:flex-end}
.total-box .k{font-weight:600}
.total-box .v{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--chip);font-size:14.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--ink);background:var(--chip2)}
.tabs button.on{background:var(--dk);color:var(--dk-ink)}
.ed-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.rail{flex:1 1 270px;min-width:0;display:flex;flex-direction:column;gap:16px}
.center{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:16px}
.cfg-col{flex:1 1 380px;min-width:0}
.wide{flex:999 1 860px;min-width:0}
.pos-list{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.pos{border-radius:16px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px transparent}
.pos.on{background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--ink)}
.pos-main{display:flex;gap:12px;align-items:center;padding:10px;border:0;background:transparent;text-align:left;color:inherit;width:100%;border-radius:16px 16px 0 0}
.pos .thumb{background:var(--paper)}
.pos-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.pos-meta{font-size:12.5px;color:var(--ink3)}
.pos-no{font-weight:700;font-size:11.5px;letter-spacing:.04em;color:var(--ink3)}
.pos-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-act{display:flex;align-items:center;padding:0 6px 6px 12px}
.pos-price{font-size:14px;font-weight:800;margin-right:auto}
.pos-err{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:800;margin-right:6px;vertical-align:1px}
.recap{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.recap .ln{display:flex;justify-content:space-between;align-items:center;gap:12px}
.recap .ln > span:first-child,.recap .ln > label{color:var(--ink2)}
.recap .ln > span:last-child{font-weight:600}
.recap .grand{display:flex;justify-content:space-between;align-items:center;background:var(--dk);color:var(--dk-ink);border-radius:14px;padding:14px 16px;margin:4px -4px 0}
.recap .grand b{font-weight:700}
.recap .grand .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.recap .rate{text-align:right}
.stage-card{overflow:hidden}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px 12px 20px}
.stage-top .tl{display:flex;align-items:center;gap:8px;flex:1 1 280px;min-width:0}
.poz-tag,.poz{height:30px;padding:0 10px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:800;display:inline-flex;align-items:center;flex:none;white-space:nowrap}
.title-inp{border:0;border-radius:10px;background:transparent;font-size:22px;font-weight:800;color:var(--ink);height:44px;padding:0 8px;min-width:0;flex:1 1 auto;letter-spacing:-.025em;width:100%}
.title-inp:hover{background:var(--surface2)}
.title-inp:focus{outline:0;background:var(--surface2);box-shadow:inset 0 0 0 2px var(--ink)}
.stage-tr{display:flex;align-items:center;gap:6px}
.dims-bar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 16px;padding:4px 20px 16px}
.dims-bar .field{flex:0 1 210px}
.dims-bar .field.qty{flex:0 1 160px;margin-left:auto}
.dims-note{flex:1 1 100%;margin-top:-6px}
.draw-wrap{padding:0 12px 12px}
.stage{position:relative;background-color:var(--paper);background-image:radial-gradient(var(--paper-dot) 1px,transparent 1.2px);background-size:20px 20px;border-radius:18px;padding:60px 14px 8px;display:flex;align-items:center;justify-content:center}
.stage > svg{width:100%;height:clamp(320px,52vh,560px);display:block;user-select:none;-webkit-user-select:none}
.stage > svg.dragging,.stage > svg.dragging .pick{cursor:grabbing!important}
.stage .pick:hover{stroke:rgba(20,32,25,.45);stroke-width:2.5px}
.barhit{cursor:col-resize;outline:none;touch-action:none}
.barhit.h{cursor:row-resize}
.barhit .hit{fill:transparent}
.barhit:hover .hit{fill:rgba(20,32,25,.10)}
.barhit .grip{fill:#142019;stroke:#FFFFFF;stroke-width:2px;opacity:0;transition:opacity .12s}
.barhit:hover .grip,.barhit.on .grip,.barhit:focus-visible .grip{opacity:1}
.barhit:focus-visible .hit{stroke:var(--focus);stroke-width:3px;vector-effect:non-scaling-stroke}
.draw-tools{position:absolute;left:14px;top:14px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 28px)}
.draw-tools .btn{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px;background:#FFFFFF;color:#142019;box-shadow:inset 0 0 0 1.5px #D3DBCD}
.draw-tools .btn:hover{box-shadow:inset 0 0 0 1.5px #142019}
.draw-tools .btn.primary{background:#142019;color:#F4F7F0;box-shadow:none}
.draw-hint{font-size:12.5px;font-weight:600;color:#142019;background:#FFFFFF;border-radius:10px;padding:7px 11px;box-shadow:0 2px 8px rgba(20,32,25,.12)}
.stage-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:2px 20px 16px;font-size:13px;color:var(--ink2)}
.stage-foot b{font-weight:800;color:var(--ink)}
.legend{display:inline-flex;align-items:center;gap:6px}
.dimlab{cursor:pointer;outline:none}
.dimlab rect{fill:transparent;stroke:none}
.dimlab:hover rect,.dimlab:focus-visible rect{fill:var(--acc);stroke:#142019;stroke-width:1px;vector-effect:non-scaling-stroke}
.dim-pop{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:12px;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 16px));animation:pop .14s ease}
.dim-pop.below{transform:translate(-50%,0)}
.dim-row{display:flex;gap:6px;align-items:center}
.dim-row .numbox{flex:1;min-width:0;height:40px}
.warns{margin:0 12px 12px;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:var(--warn);display:flex;flex-direction:column;gap:6px;font-size:13px}
.warns > div{display:flex;gap:8px;align-items:flex-start}
.warns.err{background:var(--bad-soft);color:var(--bad)}
.fixes{display:flex;flex-direction:column;gap:8px;margin-top:4px;padding-top:10px;border-top:1.5px solid currentColor}
.fixes .fix{display:flex;flex-direction:column;gap:6px}
.fixes .btn{color:var(--ink)}
.fixes.panel{margin:0;padding:12px 14px;border:0;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-size:13px}
.grid-tools{display:flex;flex-wrap:wrap;gap:6px}
.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;align-items:start}
.oline{display:flex;justify-content:space-between;gap:16px;padding:12px 20px;border-top:1.5px solid var(--surface3)}
.oline .t{font-size:14.5px;font-weight:600}
.oline .d{font-size:12.5px;color:var(--ink3);margin-top:1px}
.oline .v{font-size:14.5px;font-weight:700;white-space:nowrap}
.o-tot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:var(--bg)}
.o-tot b{font-weight:700}
.o-tot .v{font-size:18px;font-weight:800}
.tech{padding:0 20px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tech > div,.stat{background:var(--surface2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.tech span{font-size:12.5px;color:var(--ink3)}
.tech b{font-size:16px;font-weight:700;margin-top:2px}
.stat-card{grid-column:1/-1}
.stat-tbl td{font-size:13.5px}
.stat-tbl tr.bad td{background:var(--bad-soft)}
.stat-tbl tr.warn td{background:var(--warn-soft)}
.stat-ok{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-size:13px;white-space:nowrap;font-weight:600}
.stat-warn{display:inline-flex;align-items:center;gap:5px;color:var(--warn);font-size:13px}
.stat-bad{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--warn);font-size:13px}
.stat-bad .btn{color:var(--ink)}
.cfg{overflow:hidden}
.acc-sec{border-top:1.5px solid var(--bg)}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:15px 20px;border:0;background:transparent;color:inherit;text-align:left}
.acc-h:hover{background:var(--hover)}
.acc-n{width:30px;height:30px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;color:var(--ink2)}
.acc-sec.open .acc-n{background:var(--acc);color:var(--acc-ink)}
.acc-tt{display:flex;flex-direction:column;min-width:0;flex:1}
.acc-title{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.acc-sum{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-b{padding:2px 20px 22px 20px;display:flex;flex-direction:column;gap:20px}
@media (max-width:520px){.acc-b{padding-left:20px}}
.chev{flex:none;color:var(--ink3);transition:transform .15s}
.acc-sec.open .chev{transform:rotate(180deg)}
.sub{background:var(--surface2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.sub .numbox{background:var(--surface)}
.sub-opts{display:flex;flex-direction:column;gap:10px;padding:6px 0 0 32px}
.cfg-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;background:var(--dk);color:var(--dk-ink)}
.cfg-f .k{font-size:12.5px;color:var(--dk-mute);font-weight:600}
.cfg-f .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cfg-f .btn.out{background:transparent;color:var(--dk-ink);box-shadow:inset 0 0 0 1.5px var(--dk-line)}
.cfg-f .btn.out:hover{box-shadow:inset 0 0 0 1.5px var(--dk-ink)}
.sel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.sel-head .t{font-weight:800;font-size:15px}
.type-box{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;border-radius:16px;background:var(--surface2)}
.type-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:4px 20px 20px}
.ov-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:0;border-radius:16px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px transparent}
.ov-card:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.ov-card.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.ov-pv{height:130px;border-radius:10px;background:var(--paper);display:grid;place-items:center;padding:8px;margin-bottom:4px}
.ov-pv svg{width:100%;height:100%}

/* podela i otvaranje */
.groupt{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.groupt .n{text-transform:none;letter-spacing:0;font-weight:500}
.insp{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.insp-h{display:flex;align-items:center;gap:10px}
.insp-ic{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.insp-t{font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.otiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.otile{border:0;border-radius:12px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line2);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-size:13px;font-weight:700;text-align:center;line-height:1.15}
.otile:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.otile.on{background:var(--dk);color:var(--dk-ink);box-shadow:none}
.otile .pr{font-size:11.5px}
.otile.on .pr{color:var(--dk-mute)}
.warn1{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.warn1 svg{flex:none;margin-top:1px}
.split-row{display:flex;gap:8px;flex-wrap:wrap}
.splitbtn{flex:1 1 130px;min-height:56px;border:0;border-radius:14px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--ink);text-align:left}
.splitbtn svg{flex:none}
.splitbtn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.splitbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 0 0 1.5px var(--line2)}
.splitbtn b{display:block;font-size:14px}
.splitbtn small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.svopt{min-height:42px;padding:0 12px;border:0;border-radius:12px;background:var(--surface3);box-shadow:inset 0 0 0 1.5px var(--line2);font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.svopt:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.svopt:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 0 0 1.5px var(--line2)}
.svopt.on{background:var(--acc);color:var(--acc-ink);box-shadow:inset 0 0 0 1.5px #142019}
.svopt.on .pr{color:var(--acc-ink);opacity:.75}
.btn-danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn-danger:hover{filter:brightness(.97);box-shadow:none}

/* dodaci i ugradnja */
.addons{display:flex;flex-direction:column;gap:10px}
.addon{background:var(--surface2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.addon-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.addon-t{display:flex;flex-direction:column;min-width:0}
.addon-t b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.addon-t .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{width:48px;height:28px;border-radius:999px;border:0;background:var(--chip2);position:relative;flex:none;padding:0;transition:background .15s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--acc);box-shadow:inset 0 0 0 1.5px #142019}
.switch.on .knob{transform:translateX(20px);background:#142019}
.rlist{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line2);overflow:hidden}
.rl{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-top:1.5px solid var(--surface3);background:transparent;text-align:left;color:var(--ink);font-size:14px}
.rl:first-child{border-top:0}
.rl:hover{background:var(--hover)}
.rl-dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line3);flex:none;transition:box-shadow .12s}
.rl.on .rl-dot{box-shadow:inset 0 0 0 5.5px var(--dk)}
.rl-t{flex:1;min-width:0;font-weight:600;line-height:1.25}
.rl.on .rl-t{font-weight:800}
.addon-sel{display:flex;flex-direction:column;gap:10px}
.rl-t small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.rl-p{font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink2)}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:40px;height:40px;border-radius:50%;border:0;background:var(--sw);box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.5);display:grid;place-items:center;color:#FFFFFF;padding:0}
.swb:hover{box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.5),0 0 0 2px var(--surface2),0 0 0 3.5px var(--line3)}
.swb.on{box-shadow:inset 0 0 0 1.5px rgba(128,128,128,.5),0 0 0 2.5px var(--surface2),0 0 0 4.5px var(--ink)}
.swb svg{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6))}
.colgrp{display:flex;flex-direction:column;gap:8px}
.colk{display:flex;align-items:baseline;gap:8px;font-size:13.5px;flex-wrap:wrap}
.colk > span:first-child{font-weight:700;min-width:58px}
.colv{color:var(--ink2)}
.kv-n{display:inline-flex;align-items:center;gap:6px}
.kv-n i{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);flex:none}
.seg-full{display:flex;width:100%;flex-wrap:nowrap}
.seg-full button{flex:1 1 0;min-width:0;height:auto;min-height:48px;padding:6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center;font-size:13.5px}
.seg-full button small{font-size:11.5px;font-weight:500;color:var(--ink3);margin-top:1px}
.seg-full button:disabled{opacity:.4;cursor:not-allowed}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{flex:1 1 130px;min-height:48px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--ink);font-size:14px;font-weight:600;text-align:left;line-height:1.2}
.tchip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tchip small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
.tchip .ck{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line3);display:grid;place-items:center;flex:none}
.tchip .ck svg{width:14px;height:14px}
.tchip.on{box-shadow:inset 0 0 0 2px var(--ink)}
.tchip.on .ck{background:var(--dk);color:var(--dk-ink);box-shadow:none}
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;padding-top:2px}
.tgl-row small{display:block;font-size:12px;color:var(--ink3);font-weight:500}

/* šabloni */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.preset{display:flex;flex-direction:column;gap:8px;padding:12px;border:0;border-radius:16px;background:var(--surface2);text-align:left;box-shadow:inset 0 0 0 1.5px transparent}
.preset:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.preset .pv{height:110px;border-radius:10px;background:var(--paper);display:grid;place-items:center;padding:8px}
.preset .pv svg{width:100%;height:100%}
.preset b{font-size:14px}
.preset small{font-size:12.5px;color:var(--ink3)}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,13,.5);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(880px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);animation:pop .18s ease}

    const D = dragRef.current, st = D.st; if (!st) return;

    const d = D.d; D.d = null; setDrag(null);
    if (!cancel && d && d.tK >= 0 && d.ok) onMove(d.sK, d.tK, d.zone, false);
  };

  const cells = g.cells.map((c, k) => {
    const L = mr(c), S = c.sash ? mr(c.sash) : L, G = mr(c.glass), In = mr(c.inner);
    const isL = c.code === 'okL' || c.code === 'osL' || c.code === 'doorL';
    const isR = c.code === 'okD' || c.code === 'osD' || c.code === 'doorD';
    let hingeL = isL, hingeR = isR;
    if (mirror) { hingeL = isR; hingeR = isL; }
    const kip = c.code === 'kip' || c.code === 'osL' || c.code === 'osD';
    let hd = null, lock = null;
    if (c.open && (!mirror || c.door)) {
      // ručka: na strani suprotnoj od šarki (gledano sa strane crteža)
      const sideX = (mirror ? isL : isR) ? 'L' : (mirror ? isR : isL) ? 'R' : null;
      const sa = c.door ? SA_DOOR : SA;
      if (sideX) {
        const hx = sideX === 'R' ? S.x + S.w - sa / 2 - 10 : S.x + sa / 2 - 10;
        let hy = (c.door || (p.type === 'door' && c.kind === 'main')) ? c.sash.y + c.sash.h - 1050 - 70 : c.sash.y + c.sash.h / 2 - 70;
        hy = Math.max(c.sash.y + sa, hy);
        hd = { x: hx, y: hy, w: 20, h: 140 };
        if (c.door) lock = { cx: hx + 10, cy: hy + 210, r: 14 };
      } else hd = { x: S.x + S.w / 2 - 70, y: c.sash.y + SA / 2 - 10, w: 140, h: 20 };
    }
    const isMain = c.kind === 'main';
    const on = isMain && c.idx === active;
    let bad = false, warnCell = false;
    if (showLimits) {
      const LL = limitFor(P, 'cells', cellLimitId(p, c));
      const dd = c.sash || c;
      bad = !!LL && !(dd.w >= num(LL.wMin, 0) - 0.5 && dd.h >= num(LL.hMin, 0) - 0.5);
      warnCell = !bad && !!c.statBad;
    }
    const bw = 26;
    const Pn = c.panel ? mr(c.panel) : null;
    return html`<g>
      <rect x=${L.x} y=${L.y} width=${L.w} height=${L.h} fill=${fill} stroke=${edge} stroke-width="1" vector-effect=${NS}/>
      ${c.open ? html`<rect x=${S.x} y=${S.y} width=${S.w} height=${S.h} fill=${fill} stroke=${edge} stroke-width="1.2" vector-effect=${NS}/>` : null}
      ${!c.panelFull ? html`<rect x=${G.x} y=${G.y} width=${G.w} height=${G.h} fill=${glassC} stroke=${edge} stroke-width="0.85" vector-effect=${NS}/>` : null}
      ${c.bars.map(b => b.vert
        ? html`<rect x=${G.x + G.w * b.pct / 100 - bw / 2} y=${G.y} width=${bw} height=${G.h} fill=${fill} stroke=${edge} stroke-width="0.8" vector-effect=${NS}/>`
        : html`<rect x=${G.x} y=${G.y + G.h * b.pct / 100 - bw / 2} width=${G.w} height=${bw} fill=${fill} stroke=${edge} stroke-width="0.8" vector-effect=${NS}/>`)}
      ${isMain && c.open && !c.door && !c.panelFull && p.mesh && p.mesh !== 'none' ? html`<rect x=${G.x} y=${G.y} width=${G.w} height=${G.h} fill=${`url(#${id}m)`}/>` : null}
      ${Pn ? html`<rect x=${Pn.x} y=${Pn.y} width=${Pn.w} height=${Pn.h} fill=${fill} stroke=${edge} stroke-width="1" vector-effect=${NS}/><rect x=${Pn.x + 40} y=${Pn.y + 40} width=${Math.max(10, Pn.w - 80)} height=${Math.max(10, Pn.h - 80)} fill="none" stroke=${edge} stroke-width="0.8" vector-effect=${NS}/>` : null}
      ${hingeL ? html`<polyline points=${`${In.x + In.w},${In.y} ${In.x},${In.y + In.h / 2} ${In.x + In.w},${In.y + In.h}`} fill="none" stroke=${INK} stroke-width="1.1" vector-effect=${NS}/>` : null}
      ${hingeR ? html`<polyline points=${`${In.x},${In.y} ${In.x + In.w},${In.y + In.h / 2} ${In.x},${In.y + In.h}`} fill="none" stroke=${INK} stroke-width="1.1" vector-effect=${NS}/>` : null}
      ${kip ? html`<polyline points=${`${In.x},${In.y} ${In.x + In.w / 2},${In.y + In.h} ${In.x + In.w},${In.y}`} fill="none" stroke=${INK} stroke-width="1.1" stroke-dasharray=${dash} vector-effect=${NS}/>` : null}
      ${hd ? html`<rect x=${hd.x} y=${hd.y} width=${hd.w} height=${hd.h} rx="6" fill=${c.door ? '#A9AFB4' : hHex} stroke=${INK} stroke-width="1" vector-effect=${NS}/>` : null}
      ${lock ? html`<circle cx=${lock.cx} cy=${lock.cy} r=${lock.r} fill="#C9CDD1" stroke=${INK} stroke-width="1" vector-effect=${NS}/>` : null}
      ${bad ? html`<rect x=${S.x} y=${S.y} width=${S.w} height=${S.h} fill="#D93A2F" fill-opacity="0.16" stroke="#D93A2F" stroke-width="1.6" vector-effect=${NS}/>` : null}
      ${warnCell ? html`<rect class="stat-warn-cell" x=${S.x} y=${S.y} width=${S.w} height=${S.h} fill="#E39B12" fill-opacity="0.14" stroke="#D18A00" stroke-width="1.6" stroke-dasharray="10 6" vector-effect=${NS}/>` : null}
      ${on ? html`<rect class="sel-cell" x=${S.x} y=${S.y} width=${S.w} height=${S.h} rx=${fs * 0.1} style=${`fill:${accent}`} fill-opacity="0.22" stroke=${INK} stroke-width="2.5" vector-effect=${NS} pointer-events="none"/>` : null}
      ${onPick && c.kind === 'transom' && !draw ? html`
        ${tActive ? html`<rect class="sel-cell" x=${L.x} y=${L.y} width=${L.w} height=${L.h} rx=${fs * 0.1} style=${`fill:${accent}`} fill-opacity="0.22" stroke=${INK} stroke-width="2.5" vector-effect=${NS} pointer-events="none"/>` : null}
        <rect class="badge" x=${L.x + fs * 0.22} y=${L.y + fs * 0.22} width=${fs * 1.15} height=${fs * 1.15} rx=${fs * 0.36} style=${tActive ? `fill:${accent}` : 'fill:#FFFFFF'} stroke=${INK} stroke-width="1.5" vector-effect=${NS}/>
        <text x=${L.x + fs * 0.795} y=${L.y + fs * 0.795} dy="0.36em" text-anchor="middle" style=${`font-family:'Bricolage Grotesque',var(--f-body),sans-serif;font-size:${fs * 0.68}px;font-weight:800;fill:${INK}`}>N</text>
        <rect x=${L.x} y=${L.y} width=${L.w} height=${L.h} fill="transparent" class="pick pick-t" vector-effect=${NS} style="cursor:pointer" onClick=${e => { e.stopPropagation(); if (dragRef.current.just) return; onPick('T'); }}><title>Nadsvetlo: ${OPEN[c.code] ? OPEN[c.code].label : 'Fiksno'}</title></rect>` : null}
      ${onPick && isMain && !draw ? html`
        <rect class="badge" x=${S.x + fs * 0.22} y=${S.y + fs * 0.22} width=${fs * 1.15} height=${fs * 1.15} rx=${fs * 0.36} style=${on ? `fill:${accent}` : 'fill:#FFFFFF'} stroke=${INK} stroke-width="1.5" vector-effect=${NS}/>
        <text x=${S.x + fs * 0.795} y=${S.y + fs * 0.795} dy="0.36em" text-anchor="middle" style=${`font-family:'Bricolage Grotesque',var(--f-body),sans-serif;font-size:${fs * 0.68}px;font-weight:800;fill:${INK}`}>${c.idx + 1}</text>
        <rect x=${S.x} y=${S.y} width=${S.w} height=${S.h} fill="transparent" class="pick" vector-effect=${NS} style=${onMove ? 'cursor:grab' : 'cursor:pointer'} data-k=${k}
          onPointerDown=${onMove ? e => { if (e.button === 0) dragRef.current.st = { k, x: e.clientX, y: e.clientY, active: false }; } : null}
          onClick=${e => { e.stopPropagation(); if (dragRef.current.just) return; onPick(c.idx); }}><title>${'Polje ' + (c.idx + 1) + ': ' + OPEN[c.code].label + (onMove ? ' · klik bira, prevlačenje premešta' : '')}</title></rect>` : null}

  });

  // kote
  const dimEls = [];
  if (dims) {
    const t = fs * 0.28;
    // kota je klikabilna samo na radnom crtežu (onDim), ne u PDF-u i sličicama
    const lab = (cx, cy, label, key, title, vert, bold) => {
      const w = fs * 0.62 * String(label).length + fs * 0.9, h = fs * 1.25;
      const txt = vert
        ? html`<text x=${cx} y=${cy} text-anchor="middle" dy="0.9em" style=${bold ? textStB : textSt}>${label}</text>`
        : html`<text x=${cx} y=${cy} text-anchor="middle" style=${bold ? textStB : textSt}>${label}</text>`;
      if (!onDim) return vert ? html`<g transform=${`rotate(-90 ${cx} ${cy})`}>${txt}</g>` : txt;
      const ry = vert ? cy - fs * 0.12 : cy - fs * 0.98;
      return html`<g class="dimlab" transform=${vert ? `rotate(-90 ${cx} ${cy})` : ''} data-dim=${key} role="button" tabindex="0" aria-label=${title + ': ' + label + ' mm, klik za izmenu'}
        onClick=${e => { e.stopPropagation(); onDim({ key, title, value: Number(label), el: e.currentTarget }); }}

      <line x1=${x1} y1=${y} x2=${x2} y2=${y} style=${lineSt} stroke-width="1" vector-effect=${NS}/>
      <line x1=${x1 - t} y1=${y + t} x2=${x1 + t} y2=${y - t} style=${lineSt} stroke-width="1.3" vector-effect=${NS}/>
      <line x1=${x2 - t} y1=${y + t} x2=${x2 + t} y2=${y - t} style=${lineSt} stroke-width="1.3" vector-effect=${NS}/>

    const vdim = (x, y1, y2, label, key, title) => html`<g key=${key}>
      <line x1=${x} y1=${y1} x2=${x} y2=${y2} style=${lineSt} stroke-width="1" vector-effect=${NS}/>
      <line x1=${x - t} y1=${y1 + t} x2=${x + t} y2=${y1 - t} style=${lineSt} stroke-width="1.3" vector-effect=${NS}/>
      <line x1=${x - t} y1=${y2 + t} x2=${x + t} y2=${y2 - t} style=${lineSt} stroke-width="1.3" vector-effect=${NS}/>
      ${key === 'rb' ? html`<g transform=${`rotate(-90 ${x + fs * 0.45} ${(y1 + y2) / 2})`}><text x=${x + fs * 0.45} y=${(y1 + y2) / 2} text-anchor="middle" dy="0.9em" style=${textSt}>${label}</text></g>` : lab(x + fs * 0.45, (y1 + y2) / 2, label, key, title, true, key === 'th')}</g>`;
    const y1 = g.H + sill + fs * 1.5;
    // pomoćne (produžne) linije kota, kao na tehničkom crtežu

    const yTot = g.n > 1 ? y1 + fs * 1.75 : y1, eb = g.H + sill * 0.4;
    ext(0, eb, 0, yTot + fs * 0.35); ext(g.W, eb, g.W, yTot + fs * 0.35);
    const vxe = g.W + fs * 0.9 + ((g.T > 0 || rowDims) ? fs * 1.8 : 0) + fs * 0.35;
    ext(g.W + fs * 0.2, g.H, vxe, g.H); ext(g.W + fs * 0.2, rb ? -rb : 0, vxe, rb ? -rb : 0);
    if (rb) ext(g.W + fs * 0.2, 0, g.W + fs * 1.25, 0);
    if (g.n > 1) {
      let b = [0];
      const ax = g.grid ? g.colAxis : g.fAxis;

        if (j > 0) ext(a, eb, a, y1 + fs * 0.35);
        dimEls.push(hdim(a, c, y1, String(Math.round(b[j + 1] - b[j])), 'f' + j, (g.grid ? 'Širina kolone ' : 'Širina polja ') + (j + 1)));

    const vx = g.W + fs * 0.9;

    if (rb) dimEls.push(vdim(vx, -rb, 0, String(Math.round(rb)), 'rb', 'Kutija roletne'));
    if (g.T > 0) {
      ext(g.W + fs * 0.2, g.T, vx + fs * 2.15, g.T);
      dimEls.push(vdim(vx + fs * 1.8, 0, g.T, String(Math.round(g.T)), 't1', 'Visina nadsvetla'));
      dimEls.push(vdim(vx + fs * 1.8, g.T, g.H, String(Math.round(g.H - g.T)), 't2', 'Visina donjeg dela'));

    if (rowDims) {
      let yy = 0;
      rowList.forEach((hh, k) => {
        const isTop = g.topH > 0 && k === 0, isBot = g.botH > 0 && k === rowList.length - 1, ri = k - (g.topH > 0 ? 1 : 0);
        dimEls.push(vdim(vx + fs * 1.8, yy, yy + hh, String(Math.round(hh)), isTop ? 'top' : isBot ? 'bot' : `r${dimCol}_${ri}`, isTop ? 'Visina svetlarnika iznad' : isBot ? 'Visina svetlarnika ispod' : `Visina reda ${ri + 1} (kolona ${dimCol + 1})`));
        yy += hh;
      });
    }
  }

  // alat za crtanje stuba / prečke
  let drawEls = null;
  if (draw) {
    const pl = hov ? barPlan(p, draw.dir, hov.x, hov.y) : null;
    const X = v => mirror ? g.W - v : v;
    const col = pl && pl.ok ? accent : '#D93A2F';
    let guide = null;
    if (pl && pl.line) {
      const L = pl.line, vert = L.x1 === L.x2;
      const x1 = X(L.x1), x2 = X(L.x2);
      const bx = vert ? x1 - MU / 2 : Math.min(x1, x2), by = vert ? L.y1 : L.y1 - MU / 2;
      const bw = vert ? MU : Math.abs(x2 - x1), bh = vert ? L.y2 - L.y1 : MU;
      const lbl = (x, y, t, anchor) => html`<text x=${x} y=${y} text-anchor=${anchor} dy="0.35em" style=${`font-family:'Bricolage Grotesque',var(--f-body),sans-serif;font-size:${fs}px;font-weight:700;fill:${pl.ok ? INK : col};paint-order:stroke;stroke:#FFFFFF;stroke-width:${fs * 0.35}px;stroke-linejoin:round`}>${t}</text>`;
      const ga = pl.a != null ? Math.round(pl.a) : null, gb = pl.b != null ? Math.round(pl.b) : null;
      const left = mirror ? gb : ga, right = mirror ? ga : gb;
      guide = html`<g pointer-events="none" class="bar-guide">
        <rect x=${bx} y=${by} width=${bw} height=${bh} style=${`fill:${col}`} fill-opacity="0.45"/>
        <line x1=${x1} y1=${L.y1} x2=${x2} y2=${L.y2} style=${`stroke:${pl.ok ? INK : col}`} stroke-width="2" stroke-dasharray="8 5" vector-effect=${NS}/>
        ${ga != null ? (vert
          ? html`${lbl(x1 - fs * 0.7, hov.y, '← ' + left, 'end')}${lbl(x1 + fs * 0.7, hov.y, right + ' →', 'start')}`
          : html`${lbl(X(hov.x), L.y1 - fs * 0.9, '↑ ' + ga, 'middle')}${lbl(X(hov.x), L.y1 + fs * 0.9, '↓ ' + gb, 'middle')}`) : null}
      </g>`;
    }
    const msg = pl && !pl.ok && pl.msg ? html`<text x=${X(hov.x)} y=${Math.max(fs, hov.y - fs * 1.4)} text-anchor="middle" pointer-events="none" style=${`font-family:var(--f-body),sans-serif;font-size:${fs * 0.8}px;font-weight:600;fill:#B9342A;paint-order:stroke;stroke:#FFFFFF;stroke-width:${fs * 0.35}px`}>${pl.msg}</text>` : null;
    drawEls = html`${guide}${msg}
      <rect class="draw-hit" x="0" y="0" width=${g.W} height=${g.H} fill="transparent" style=${`cursor:${draw.dir === 'v' ? 'col-resize' : 'row-resize'}`}
        onPointerMove=${e => { const q = toModel(e); if (q) setHov(q); }}
        onPointerLeave=${() => setHov(null)}
        onClick=${e => { e.stopPropagation(); const q = toModel(e); if (q) draw.onAdd(q.x, q.y); }}><title>${draw.dir === 'v' ? 'Klik postavlja stub' : 'Klik postavlja prečku'}</title></rect>`;
  }

  let dragEls = null;
  if (drag) {
    const Sc = g.cells[drag.sK], SR = mr(Sc.sash || Sc);
    const parts = [html`<rect x=${SR.x} y=${SR.y} width=${SR.w} height=${SR.h} fill="#142019" fill-opacity="0.28" stroke="#142019" stroke-width="1.5" stroke-dasharray="6 4" vector-effect=${NS} pointer-events="none"/>`];
    if (drag.tK >= 0) {
      const Tc = g.cells[drag.tK], TR = Tc.sash || Tc, col = drag.ok ? accent : '#D93A2F';
      const e = Math.max(MU, Math.min(TR.w, TR.h) * 0.16);
      const zr = drag.zone === 'l' ? { x: TR.x, y: TR.y, w: e, h: TR.h } : drag.zone === 'r' ? { x: TR.x + TR.w - e, y: TR.y, w: e, h: TR.h }
        : drag.zone === 't' ? { x: TR.x, y: TR.y, w: TR.w, h: e } : drag.zone === 'b' ? { x: TR.x, y: TR.y + TR.h - e, w: TR.w, h: e } : TR;
      const Z = mr(zr), T2 = mr(TR);
      parts.push(html`<rect x=${T2.x} y=${T2.y} width=${T2.w} height=${T2.h} fill="none" style=${`stroke:${drag.ok ? INK : col}`} stroke-width="2.4" vector-effect=${NS} pointer-events="none"/>`);
      parts.push(html`<rect class="drop-zone" x=${Z.x} y=${Z.y} width=${Z.w} height=${Z.h} style=${`fill:${col}`} fill-opacity=${drag.zone === 'c' ? 0.2 : 0.55} pointer-events="none"/>`);
    }
    if (drag.label) {
      const X = mirror ? g.W - drag.q.x : drag.q.x;
      const anc = X > g.W * 0.7 ? 'end' : X < g.W * 0.3 ? 'start' : 'middle';
      parts.push(html`<text class="drop-label" x=${X} y=${Math.max(fs, drag.q.y - fs * 1.1)} text-anchor=${anc} pointer-events="none" style=${`font-family:var(--f-body),sans-serif;font-size:${fs * 0.85}px;font-weight:700;fill:${drag.ok ? '#142019' : '#B9342A'};paint-order:stroke;stroke:#FFFFFF;stroke-width:${fs * 0.4}px;stroke-linejoin:round`}>${viewLbl(drag.label)}</text>`);
    }

  }

  // stubovi i prečke na crtežu: klik bira, prevlačenje pomera (korak 5 mm), strelice 10 mm (Shift 1 mm), Delete uklanja
  let barEls = null;
  if (bars && onBar && !drag) {
    const barDown = (e, b) => { if (e.button !== 0) return; e.stopPropagation(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) { } barRef.current.d = { key: b.key, last: b.pos, min: Math.min(b.min, b.max), max: Math.max(b.min, b.max), vert: b.vert }; onBar(b.key); };
    const barMv = (e, b) => { const d = barRef.current.d; if (!d || d.key !== b.key) return; const q = toModel(e); if (!q) return; const v = clamp(Math.round((d.vert ? q.x : q.y) / 5) * 5, d.min, d.max); if (v !== d.last) { d.last = v; onBarMove(b.key, v); } };
    const barUp = () => { barRef.current.d = null; };
    const barKey = (e, b) => {
      const k = e.key, stp = e.shiftKey ? 1 : 10; let dir = 0;
      if ((k === 'Delete' || k === 'Backspace') && onBarDel) { e.preventDefault(); onBarDel(b.key); return; }
      if (b.vert) { if (k === 'ArrowLeft') dir = -1; else if (k === 'ArrowRight') dir = 1; if (mirror) dir = -dir; }
      else { if (k === 'ArrowUp') dir = -1; else if (k === 'ArrowDown') dir = 1; }
      if (dir) { e.preventDefault(); onBarMove(b.key, clamp(b.pos + dir * stp, Math.min(b.min, b.max), Math.max(b.min, b.max))); }
    };
    barEls = bars.map(b => {
      const R = mr({ x: b.x, y: b.y, w: b.w, h: b.h }), on = selBar === b.key;

        const res = await saveFile(pdfName(o), pdf.output('blob'));
        if (alive) onDone({ ok: true, res, offerId: o.id });
      } catch (e) { if (alive) onDone({ ok: false, err: e && e.message ? e.message : 'PDF nije napravljen.' }); }
    })();
    return () => { alive = false; };
  }, []);
  if (!o) return null;
  return html`<div class="capture" ref=${ref} aria-hidden="true"><${PdfDoc} o=${o} data=${data}/></div>`;
}

function PdfPreview({ o, data }) {
  const ref = useRef(null);
  const [w, setW] = useState(700);
  useEffect(() => {
    if (!ref.current) return;
    // Merenje se odlaže na sledeći frejm i ignoriše sitne promene, da promena razmere
    // stranica ne bi ponovo okinula posmatrač u istom ciklusu (ResizeObserver loop)
    let raf = 0;
    const ro = new ResizeObserver(es => {
      const nw = Math.round(es[es.length - 1].contentRect.width);
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setW(prev => Math.abs(prev - nw) > 4 ? nw : prev));
    });
    ro.observe(ref.current);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);
  const sc = clamp((w - 40) / 794, 0.3, 1);
  const pages = PdfDoc({ o, data });
  const list = Array.isArray(pages) ? pages : [pages];
  return html`<div class="pdf-stack" ref=${ref}>
    ${(list.flat ? list.flat() : list).map((pg, i) => html`<div class="pdf-scaler" key=${i} style=${`width:${794 * sc}px;height:${1123 * sc}px`}><div style=${`transform:scale(${sc});width:794px`}>${pg}</div></div>`)}
  </div>`;
}

  // ── nijedna pozicija nije izabrana: pregled cele ponude ──
  if (!pos) return wrap(html`${presetModal}

  // ── pozicije sa crtežom ──

  const hasGlass = r.g.Ag > 0.0001;
  const pr = (v, u) => num(v, 0) ? '+' + fN(v) + ' ' + (u || '€') : '';

  // ── izmena mera klikom na kotu na crtežu ──
  const openDim = ({ key, title, value, el }) => {
    const st = stageRef.current; if (!st) return;

  };
  const applyDim = (key, raw) => {

  };
  // širina polja (osna mera); kad su sve upisane, ukupna širina je njihov zbir

    } else {
      const fw = (Array.isArray(p.fw) ? p.fw.slice(0, p.fields.length) : []); while (fw.length < p.fields.length) fw.push('');

    }
  }
  const noFieldHint = html`<div class="type-box"><b style="font-size:14px">Kliknite polje ili stub na crtežu</b><span class="fhint">Klik na polje podešava njegovo otvaranje${grid ? ' i ispunu' : ''}, a klik na stub ili prečku je pomera. Novi stub ili prečku dodajete dugmadima „Stub“ i „Prečka“ iznad crteža ili u kartici polja. Polje možete i prevući na drugo mesto: na sredinu drugog polja da zamene mesta, ili uz njegovu ivicu.</span></div>`;

  // ── svetlarnici: levo, desno, iznad, ispod (prozor i balkonska vrata prelaze na slobodnu podelu) ──
  const SIDE = 400, TOP = 500, BOT = 400;

      toGrid(p);

      if (where === 'R') { G.cols.push({ w: SIDE, side: true, rows: [cell()] }); p.w = Math.round(num(p.w, 0) + SIDE); }
      if (where === 'T' && !G.top) { G.top = { h: TOP, code: 'fix', fill: 'glass', sv: true }; p.h = Math.round(num(p.h, 0) + TOP); }
      if (where === 'B' && !G.bottom) { G.bottom = { h: BOT, code: 'fix', fill: 'glass', sv: true }; p.h = Math.round(num(p.h, 0) + BOT); }
    });

    const bandN = b => grid && pos.grid[b] ? (Array.isArray(pos.grid[b].parts) && pos.grid[b].parts.length > 1 ? pos.grid[b].parts.length : 1) : 0;
    const topN = grid ? bandN('top') : (pos.transom && r.g.T > 0 ? 1 : 0);
    const colN = grid ? pos.grid.cols.reduce((a, c) => a + c.rows.length, 0) : pos.fields.length;
    set({ af: { L: topN, R: topN + colN, T: 0, B: topN + colN }[where], step: 1, dim: null, bar: null, tsel: false });
    notify('Dodat svetlarnik ' + { L: 'levo', R: 'desno', T: 'iznad', B: 'ispod' }[where] + (conv ? '. Pozicija sada ima slobodnu podelu na kolone i redove.' : '.'));
  };
  const doorChecks = pos.type === 'door' ? html`<div>
    <${Check} checked=${pos.panel} onChange=${v => setP({ panel: v })} label="Parapetni panel u donjem delu krila" hint=${'+' + fN(P.extras.panel) + ' €'}/>

  </div>` : null;
  // ── podela i otvaranje: brzi raspored, polja, stubovi i prečke, inspektor, svetlarnici ──
  const bars = listBars(pos);
  const selBar = ui.bar ? bars.find(b => b.key === ui.bar) || null : null;
  const hasT = !grid && r.g.T > 0;
  const tSel = hasT && ui.tsel && !selBar;
  const vN = bars.filter(b => b.vert && !b.sv).length, hN = bars.filter(b => !b.vert && !b.sv).length;
  const lights = lightsOf(pos), lightN = ['l', 'r', 't', 'b'].filter(k => lights[k]).length;
  const winAx = !grid ? winAxis(r.g) : null;
  // osne mere polja (kao na kotama)
  const axisOf = c => {
    if (!c) return [0, 0];
    if (!grid) return c.kind === 'transom' ? [r.g.W, r.g.T] : [winAx[c.idx], r.g.H - (r.g.T || 0)];

  };
  const svOfCell = c => !c || !grid ? '' : c.top ? (isSvBand(pos.grid.top) ? 'iznad' : '') : c.bottom ? (isSvBand(pos.grid.bottom) ? 'ispod' : '') : (pos.grid.cols[c.ci] && pos.grid.cols[c.ci].side ? (c.ci === 0 ? 'levo' : 'desno') : '');
  // nova podela odmah ostaje izabrana, da se pomeri na tačnu meru
  const newBarKey = (before, after) => { const old = new Set(before.map(b => (b.vert ? 'v' : 'h') + Math.round(b.pos) + ':' + Math.round(b.vert ? b.y : b.x))); const nb = after.find(b => !old.has((b.vert ? 'v' : 'h') + Math.round(b.pos) + ':' + Math.round(b.vert ? b.y : b.x))); return nb ? nb.key : null; };
  // field = dugme „Dodaj prečku“ u kartici polja: deli samo to polje (prozor sa više polja prelazi na slobodnu podelu)
  const splitAt = (dir, x, y, field) => {
    const only = field && dir === 'h' && !grid && pos.fields.length > 1;
    const run = q => { if (only) toGrid(q); return addBar(q, dir, x, y); };
    const pl = only ? (() => { const t = clone(pos); toGrid(t); return Object.assign(barPlan(t, dir, x, y), { convert: true }); })() : barPlan(pos, dir, x, y);
    if (!pl.ok) { if (pl.msg) notify(pl.msg, 'bad'); return; }
    const tmp = clone(pos); run(tmp);
    const key = newBarKey(bars, listBars(tmp));
    upP(p => { run(p); });
    set({ af: -1, tsel: false, bar: key, dim: null, step: 1 });
    notify(pl.convert ? 'Prozor je prebačen u slobodnu poziciju, da bi prečka delila samo izabrano polje.' : (dir === 'v' ? 'Dodat stub' : 'Dodata prečka') + ` · ${Math.round(pl.a)} + ${Math.round(pl.b)} mm`);
  };
  const moveBar = (key, v) => upP(p => { barMove(p, key, v); });
  const delBar = key => { const res = barRemove(clone(pos), key); if (!res.ok) return; upP(p => { barRemove(p, key); }); set({ bar: null, af: -1, tsel: false }); notify(res.msg); };
  const pickBar = key => set({ bar: key, af: -1, tsel: false, dim: null, step: 1 });
  const toggleLight = side => {
    if (lights[side]) { upP(p => { removeLight(p, side); }); set({ bar: null, af: -1, tsel: false }); notify('Svetlarnik je uklonjen'); return; }
    addLight(side.toUpperCase());
  };
  const vIcon = s => html`<svg width=${s} height=${s} viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v13" stroke="currentColor" stroke-width="2.4"/></svg>`;
  const hIcon = s => html`<svg width=${s} height=${s} viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13" stroke="currentColor" stroke-width="2.4"/></svg>`;
  const openTiles = (cur, list, onPick) => html`<div class="otiles">${[...list].sort((x, y) => OPEN_ORDER.indexOf(x) - OPEN_ORDER.indexOf(y)).map(code => {

    const price = (code === 'doorL' || code === 'doorD') ? num(P.extras.shopDoor, 0) : num(P.openings[OPEN[code].grp], 0) + ((pos.type === 'door' && code !== 'fix') ? num(P.extras.door, 0) : 0);

    return html`<button type="button" class=${'otile open-btn' + (on ? ' on' : '')} aria-pressed=${on} data-code=${code} title=${OPEN[code].label + (L ? ` · ${L.name}: najmanje ${fN(L.wMin)} × ${fN(L.hMin)} mm` : '')} onClick=${() => onPick(code)}>
      <${OpenGlyph} code=${code}/><span>${OPEN[code].short}</span><span class="pr">${price ? '+' + fN(price) + ' €' : 'u ceni'}</span>

    </div>`;

  const SVO = [{ id: 'l', label: 'Levo', add: SIDE }, { id: 't', label: 'Iznad', add: TOP }, { id: 'b', label: 'Ispod', add: BOT }, { id: 'r', label: 'Desno', add: SIDE }];
  const podelaEditor = () => {

      ${gridFixes.length ? html`<div class="fixes panel">${gridFixes.map(fx => html`<div class="fix"><span>${fx.title}</span><div class="grid-tools">${fx.acts.map(a => html`<button class="btn sm" onClick=${a.fn}>${a.label}</button>`)}</div></div>`)}</div>` : null}

      <div>

        <div class="hint" style="margin-top:6px">Svetlarnik povećava ukupnu meru pozicije. Ponovni klik ga uklanja; širinu menjate pomeranjem njegovog spoja.</div>

  // ── sažeci sekcija ──
  const co = pick(P.colors, pos.cOut) || FALLBACK_COL, ci = pick(P.colors, pos.cIn) || FALLBACK_COL;
  const hw = pick(P.hardware, pos.hw) || { name: 'Okov' };
  const ro = pos.roletna ? rollerOf(P, pos) : null;
  const meshName = pos.mesh && pos.mesh !== 'none' ? ((P.mesh.find(k => k.id === pos.mesh) || {}).name || 'komarnik') : '';
  const mountName = pos.mount && pos.mount !== 'none' ? ((P.mount.find(k => k.id === pos.mount) || {}).name || '') : '';
  const codes = mainCells.map(c => OPEN[c.code] ? OPEN[c.code].short : 'Fiksno');
  const dod = [ro ? 'Roletna ' + ro.type.name : '', meshName ? 'Komarnik ' + meshName.toLowerCase() : '', pos.sillIn || pos.sillOut ? 'Klupice' : '', mountName ? 'Ugradnja ' + mountName : '', pos.demont ? 'Demontaža' : ''].filter(Boolean);
  const sums = [
    sys.name + ' · ' + sys.depth + ' mm' + (sys.mat === 'PVC' ? ' · klasa ' + pos.wall : ''),

  const goNext = () => { if (step >= STEPS.length - 1) { set({ presets: true }); return; } let n = step + 1; if (n === 2 && !hasGlass) n = 3; set({ step: n }); };

    }

      </div>` : html`<div class="addons">
      ${r.g.Ap > 0 ? html`<div class="note">Staklo se obračunava samo za staklena polja (${f2(r.g.Ag)} m²). Panel polja (${f2(r.g.Ap)} m²) nemaju staklo.</div>` : null}

      </div>
      <div class="addon">
        <div class="addon-h"><div class="addon-t"><b>Distancer</b><span class="hint">okvir između stakala</span></div></div>

      </div>
    </div>`;
    if (i === 3) {

      const colTxt = c => html`<b>${c.name}</b>${c.code ? ' · ' + c.code : ''}${c.surcharge ? html` · <span class="pr">+${colPct}%</span>` : null}`;

          <div class="tgl-row"><span>Protivprovalni okov RC2<small>+${fN(P.extras.rc2)} € po krilu</small></span><${Switch} on=${pos.rc2} label="RC2" onChange=${v => setP({ rc2: v })}/></div>
        </div>
        <div class="addon">
          <div class="addon-h"><div class="addon-t"><b>Kvaka</b><span class="hint">po otvarajućem krilu</span></div></div>
          <div class="seg seg-full" role="group" aria-label="Kvaka">${P.handles.map(h => { const on = pos.handle === h.id; return html`<button type="button" class=${on ? 'on' : ''} aria-pressed=${on} onClick=${() => setP({ handle: h.id })}><span class="kv-n"><i style=${`background:${h.hex}`}></i>${h.name}</span><small>${num(h.price, 0) ? '+' + fN(h.price) + ' €' : 'u ceni'}</small></button>`; })}</div>
        </div>
      </div>`;
    }
    // roletna: vrsta (grupa) pa veličina kutije
    const kinds = [...new Set((P.rollerTypes || []).map(rollerKind))];
    const curKind = ro ? rollerKind(ro.type) : kinds[0];
    const ofKind = k => (P.rollerTypes || []).filter(t => rollerKind(t) === k);
    const pickKind = k => { const list = ofKind(k); if (!list.length) return; const same = list.find(t => num(t.box, 0) === (ro ? num(ro.type.box, 0) : 185)); setP({ rType: (same || list.find(t => num(t.box, 0) === 185) || list[0]).id }); };
    const rMin = Math.min(...(P.rollerTypes || [{ ppm: 0 }]).map(t => num(t.ppm, 0)));
    const opt = (v, txt) => html`<option value=${v}>${txt}</option>`;
    return html`<div class="addons">

          ${ofKind(curKind).length > 1 || num(ro.type.box, 0) > 0 ? html`<div class="field"><span class="lbl">Kutija</span><div class="seg seg-full" role="group" aria-label="Kutija roletne">${ofKind(curKind).map(t => { const on = t.id === ro.type.id; return html`<button type="button" class=${on ? 'on' : ''} aria-pressed=${on} data-type=${t.id} onClick=${() => setP({ rType: t.id })}><span>${num(t.box, 0) > 0 ? fN(t.box) + ' mm' : 'u zidu'}</span><small>${fN(t.ppm)} €/m²</small></button>`; })}</div></div>` : html`<span class="hint">Kutija je u zidu i ne menja visinu pozicije · ${fN(ro.type.ppm)} €/m²</span>`}
          <div class="addon-sel">

        <div class="tchips">
          ${[['sillIn', 'Unutrašnja PVC', P.extras.sillIn, 'in'], ['sillOut', 'Spoljna ALU', P.extras.sillOut, 'out']].map(([k, t, pr, sd]) => { const on = !!pos[k]; return html`<button type="button" class=${'tchip' + (on ? ' on' : '')} aria-pressed=${on} onClick=${() => { setP({ [k]: !on }); if (!on) set({ side: sd }); }}><span class="ck" aria-hidden="true">${on ? Icon.check() : null}</span><span>${t}<small>${fN(pr)} €/m</small></span></button>`; })}

  const chev = html`<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;

  const sideLbl = ui.side === 'out' ? 'Pogled spolja' : 'Pogled iznutra';
  return wrap(html`${presetModal}

          ${grid ? html`<span class="fhint dims-note">Kolone i redovi sa upisanom merom se srazmerno prilagode, a „auto“ polja preuzmu razliku. Potvrdite sa Enter.</span>` : null}
        </div>
        <div class="draw-wrap">
          <div class="stage" ref=${stageRef} onClick=${() => { if (ui.dim) set({ dim: null }); else if (af >= 0) set({ af: -1 }); }}>
            <div class="draw-tools" onClick=${e => e.stopPropagation()}>
              <button type="button" class=${'btn sm' + (ui.draw === 'v' ? ' primary' : '')} aria-pressed=${ui.draw === 'v'} title="Nacrtaj vertikalni stub preko polja" onClick=${() => set({ draw: ui.draw === 'v' ? null : 'v', dim: null })}>${Icon.splitV()} Stub</button>
              <button type="button" class=${'btn sm' + (ui.draw === 'h' ? ' primary' : '')} aria-pressed=${ui.draw === 'h'} title="Nacrtaj horizontalnu prečku preko polja" onClick=${() => set({ draw: ui.draw === 'h' ? null : 'h', dim: null })}>${Icon.splitH()} Prečka</button>
              ${ui.draw ? html`<span class="draw-hint">Kliknite gde ide ${ui.draw === 'v' ? 'stub' : 'prečka'} · Esc završava</span>` : null}
            </div>
            <${WindowSVG} p=${pos} P=${P} side=${ui.side} active=${af} showLimits=${!pos.override} onPick=${i => i === 'T' ? set(tSel ? { tsel: false, dim: null } : { tsel: true, af: -1, bar: null, step: 1, dim: null }) : set(i === af && !selBar && !tSel ? { af: -1, dim: null } : { af: i, bar: null, tsel: false, step: 1, dim: null })} tActive=${tSel} bars=${ui.draw ? null : bars} selBar=${selBar ? selBar.key : null} onBar=${pickBar} onBarMove=${moveBar} onBarDel=${delBar} onDim=${openDim} draw=${ui.draw ? { dir: ui.draw, onAdd: (x, y) => doBar(ui.draw, x, y) } : null} onMove=${moveField}/>
            ${ui.dim && ui.dim.pid === pos.id ? html`<${DimPop} key=${ui.dim.key} d=${ui.dim} onApply=${v => { if (applyDim(ui.dim.key, v)) set({ dim: null }); }} onClose=${() => set({ dim: null })}/>` : null}
          </div>
        </div>
        <div class="stage-foot">
          <span><b>${sideLbl}</b> · ${(pick(P.colors, ui.side === 'out' ? pos.cOut : pos.cIn) || FALLBACK_COL).name} · ${selBar ? 'Izabran: ' + selBar.name.toLowerCase() + ' — prevucite ga ili koristite strelice' : af >= 0 ? 'Izabrano polje ' + (af + 1) + ' — kliknite stub ili prečku da je pomerite' : 'kliknite polje da podesite otvaranje, prevucite ga da ga premestite, kliknite kotu da promenite meru'}</span>
          <span class="legend"><svg width="26" height="14" viewBox="0 0 26 14" aria-hidden="true"><path d="M25 1L2 7l23 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>vrh trougla = strana šarki</span>
          <span class="legend"><svg width="26" height="14" viewBox="0 0 26 14" aria-hidden="true"><path d="M1 1l12 12 12-12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2"/></svg>isprekidano = nagibno</span>
        </div>
        ${limErrs.length ? html`<div class=${'warns ' + (pos.override ? '' : 'err')} role="status">
          ${limErrs.map(w => html`<div>${Icon.warn()}<span>${w}</span></div>`)}
          ${gridFixes.length ? html`<div class="fixes">${gridFixes.map(fx => html`<div class="fix"><span>${fx.title}</span><div class="grid-tools">${fx.acts.map(a => html`<button class="btn sm" onClick=${a.fn}>${a.label}</button>`)}</div></div>`)}</div>` : null}
          <label class="chk" style="color:inherit;min-height:30px;margin-top:2px"><input type="checkbox" checked=${!!pos.override} onChange=${e => setP({ override: e.target.checked })}/><span>Mere su potvrđene sa proizvođačem, dozvoli izuzetak</span></label>
        </div>` : null}
        ${r.warnings.length ? html`<div class="warns" role="status">${r.warnings.map(w => html`<div>${Icon.warn()}<span>${w}</span></div>`)}
          ${statFixes.length ? html`<div class="fixes"><div class="fix"><span>Brza podela (stub ili prečka na sredini, mera se posle menja klikom na kotu):</span><div class="grid-tools">${statFixes.map(c => html`<button class="btn sm" onClick=${() => splitFix(c.k)}>${c.split === 'v' ? Icon.splitV() : Icon.splitH()} ${c.name}: ${c.split === 'v' ? 'dodaj stub' : 'dodaj prečku'}</button>`)}</div></div></div>` : null}
        </div>` : null}
      </div>
      <div class="below">
        <div class="card" style="overflow:hidden">
          <div class="card-h"><h2 class="h2">Obračun pozicije</h2><span class="hint">${r.qty} × ${m(r.unit)}</span></div>
          <div>${r.lines.map(l => html`<div class="oline"><div style="min-width:0"><div class="t">${l.label}</div>${l.detail ? html`<div class="d">${l.detail}</div>` : null}</div><div class="v">${m(l.amt)}</div></div>`)}</div>
          <div class="o-tot"><b>Ukupno pozicija <span class="hint" style="font-weight:500">bez PDV</span></b><span class="v">${m(r.total)}</span></div>
        </div>
        <div class="card">
          <div class="card-h"><h2 class="h2">Tehnički podaci</h2></div>
          <div class="tech">
            <div><span>Površina</span><b>${f2(r.g.A)} m²</b></div>
            <div><span>Obim</span><b>${f2(r.g.per)} m</b></div>
            <div><span>${hasGlass ? 'Staklo (vidljivo)' : 'Panel ispuna'}</span><b>${f2(hasGlass ? r.g.Ag : r.g.Ap)} m²</b></div>
            <div><span>Uw procena</span><b>${f2(r.Uw)} W/m²K</b></div>
            <div><span>Ugradna dubina</span><b>${sys.depth} mm</b></div>
            <div><span>Komore</span><b>${sys.chambers || '—'}</b></div>
            <div><span>Uf profila</span><b>${f2(num(sys.uf, 0))}</b></div>
            <div><span>Ug stakla</span><b>${hasGlass ? f2(num(r.gl.ug, 0)) + ' · ' + r.gl.thick + ' mm' : '—'}</b></div>
            <div><span>Težina stakla</span><b>${hasGlass ? '≈ ' + Math.round(st.glassKg) + ' kg · ' + fN(st.gkg) + ' kg/m²' : '—'}</b></div>
            <div><span>Najteže krilo</span><b>${(() => { const x = st.cells.filter(c => c.open).sort((a, b) => b.kg - a.kg)[0]; return x ? '≈ ' + Math.round(x.kg) + ' / ' + fN(x.limKg) + ' kg' : 'nema krila'; })()}</b></div>
          </div>
          <p class="hint" style="margin:0;padding:0 20px 18px">Uw je procena iz površine stakla i profila — nije zamena za proračun proizvođača.</p>

        <div class="card stat-card">
          <div class="card-h" style="align-items:flex-start"><div><h2 class="h2">Statika i težina</h2><div class="hint" style="font-size:13px;margin-top:2px">${st.S.name}: krilo do ${fN(st.sKg)} kg${st.hwKg < num(st.S.sMaxKg, 0) ? ' (ograničava okov ' + st.hw.name + ')' : ''}, bočno krilo do ${fN(st.S.sRatio)}× šire nego visoko · stub i prečka do ${fN(st.S.mMax)} mm${hasGlass ? ` · ${st.gl.name}: ${fN(st.gkg)} kg/m², fiksno do ${fN(st.gMaxA)} m²` : ''}</div></div></div>
          <div class="tbl-wrap"><table class="tbl stat-tbl">
            <thead><tr><th>Element</th><th>Vrsta</th><th class="r">Mere, mm</th><th class="r">Staklo</th><th class="r">Težina</th><th>Statika</th></tr></thead>
            <tbody>
              ${st.cells.map(c => html`<tr class=${c.bad.length ? 'warn' : ''}>
                <td><b>${c.name}</b></td><td>${c.open ? (c.door ? 'krilo vrata' : 'krilo') : 'fiksno'}</td>
                <td class="r">${Math.round(c.w)} × ${Math.round(c.h)}</td><td class="r">${f2(c.gA)} m²</td>
                <td class="r">≈ ${Math.round(c.kg)} kg${c.limKg ? html`<span class="hint"> / ${fN(c.limKg)}</span>` : null}</td>
                <td>${c.bad.length ? html`<div class="stat-bad"><span>${c.bad.join('; ')}</span><button class="btn sm" onClick=${() => splitFix(c.k)}>${c.split === 'v' ? Icon.splitV() : Icon.splitH()} ${c.split === 'v' ? 'Dodaj stub' : 'Dodaj prečku'}</button></div>` : html`<span class="stat-ok">${Icon.check()} u granicama</span>`}</td>
              </tr>`)}
              ${st.mulls.map(m2 => html`<tr class=${m2.over ? 'warn' : ''}>
                <td><b>${m2.vert ? 'Stub' : 'Prečka'}</b></td><td>${m2.vert ? 'vertikalno' : 'horizontalno'}</td>
                <td class="r">${Math.round(m2.len)}</td><td class="r">—</td><td class="r">—</td>
                <td>${m2.over ? html`<span class="stat-warn">${Icon.warn()} duže od ${fN(st.S.mMax)} mm, ojačanje</span>` : html`<span class="stat-ok">${Icon.check()} u granicama</span>`}</td>
              </tr>`)}
            </tbody>
          </table></div>
          <p class="hint" style="margin:0;padding:10px 20px 18px">Statika samo upozorava i ne blokira ponudu. Težina krila = m² stakla × kg/m² + profil krila. Granice podešavate u Cenovniku, prema tabelama proizvođača profila, okova i stakla.</p>
        </div>
      </div>
    </section>

    <aside class="cfg-col">
      <div class="card cfg">
        <div class="card-h" style="padding-bottom:14px">
          <div style="min-width:0"><h2 class="h2">Konfiguracija</h2><div class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Poz. ${posIdx + 1} · ${pos.name}</div></div>
          <span class="hint" style="font-weight:700">${step >= 0 ? step + 1 : '–'} / ${STEPS.length}</span>
        </div>
        ${STEPS.map((t, i) => { const open = step === i; const off = i === 2 && !hasGlass; return html`<div class=${'acc-sec' + (open ? ' open' : '')} data-step=${i}>
          <button type="button" class="acc-h" aria-expanded=${open} onClick=${() => set({ step: open ? -1 : i })}>
            <span class="acc-n">${i + 1}</span>
            <span class="acc-tt"><span class="acc-title">${off ? t + ' · bez stakla' : t}</span><span class="acc-sum">${sums[i]}</span></span>
            ${chev}
          </button>
          ${open ? html`<div class="acc-b">${body(i)}</div>` : null}
        </div>`; })}
        <div class="cfg-f">
          <div style="display:flex;flex-direction:column"><span class="k">Pozicija ${posIdx + 1} · ${r.qty} kom</span><span class="v">${m(r.total)}</span></div>
          <div style="display:flex;gap:8px">
            <button class="btn out" disabled=${step <= 0} onClick=${goPrev}>Nazad</button>
            <button class="btn btn-acc" onClick=${goNext}>${nextLabel}</button>
          </div>
        </div>
      </div>
    </aside>
  </div>`);
}

function ClientTab({ o, upO, S, m, T }) {
  const c = o.client, t = o.terms;
  const setC = patch => upO(x => Object.assign(x.client, patch));
  const setT = patch => upO(x => Object.assign(x.terms, patch));
  const pravno = c.kind === 'pravno';
  const PAY = ['Uplata na račun', 'Gotovina', 'Platna kartica'];
