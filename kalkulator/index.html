</head>
<body style="margin:0">
<style>
/* Layout: radni program — bočna navigacija, radni prostor sa tri kolone (pozicije · crtež · konfigurator), A4 ponuda kao dokument */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --line:#E0E5EA; --line2:#CBD2DA;
  --ink:#121820; --ink2:#434E5B; --ink3:#697482;
  --stage:#F8FAFB; --grid:#E6EAEF;
  --ok:#1D7A45; --ok-soft:#E2F3E9; --warn:#995C00; --warn-soft:#FFF3DC; --bad:#B9342A; --bad-soft:#FCE7E5; --info:#2B59C3; --info-soft:#E7EDFB;
  --accent:#2B59C3; --accent-soft:rgba(43,89,195,.10); --accent-t-light:#2B59C3; --accent-t-dark:#8FA9E8; --accent-t:var(--accent-t-light); --accent-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --shadow-lg:0 12px 40px rgba(16,24,40,.18);
  --f-display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#151A21; --surface2:#1B212A; --line:#252C36; --line2:#343C48;
  --ink:#E8ECF1; --ink2:#B3BBC6; --ink3:#8691A0; --stage:#10141A; --grid:#1B2129;
  --ok:#55C487; --ok-soft:#12301F; --warn:#F0B04A; --warn-soft:#33260C; --bad:#F27B6F; --bad-soft:#3A1714; --info:#8FA9E8; --info-soft:#17223B;
  --accent-t:var(--accent-t-dark); --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151A21; --surface2:#1B212A; --line:#252C36; --line2:#343C48;
  --ink:#E8ECF1; --ink2:#B3BBC6; --ink3:#8691A0; --stage:#10141A; --grid:#1B2129;
  --ok:#55C487; --ok-soft:#12301F; --warn:#F0B04A; --warn-soft:#33260C; --bad:#F27B6F; --bad-soft:#3A1714; --info:#8FA9E8; --info-soft:#17223B;
  --accent-t:var(--accent-t-dark); --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num-t{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));transition:width .2s ease}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:15px;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-txt{min-width:0}
.brand-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:var(--ink2);font-weight:500;text-align:left;white-space:nowrap;min-height:40px}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-t);font-weight:600}
.nav svg{flex:none}
.side .cta{justify-content:center}
.theme-btn{margin-top:auto;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:var(--ink2);font-weight:500;text-align:left;white-space:nowrap;min-height:40px}
.theme-btn:hover{background:var(--surface2);color:var(--ink)}
.shell.compact .theme-btn{justify-content:center;padding-left:0;padding-right:0}
.font-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.font-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink)}
.font-opt b{font-size:14.5px;font-weight:600}
.font-opt span{font-size:12px;color:var(--ink3)}
.font-opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.side-foot{margin-top:0;font-size:11.5px;color:var(--ink3);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.fail{background:var(--bad)}
.shell.compact .side{width:68px}
.shell.compact .brand-txt,.shell.compact .nav .lbl-t,.shell.compact .side-foot,.shell.compact .cta .lbl-t,.shell.compact .theme-btn .lbl-t{display:none}
.shell.compact .nav button,.shell.compact .cta{justify-content:center;padding-left:0;padding-right:0}
.main{flex:1;min-width:0;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-left:28px;padding-right:28px}}
@media (max-width:899px){
  .shell{flex-direction:column}
  .side,.shell.compact .side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .nav{flex-direction:row}
  .side-foot,.brand-txt,.theme-btn .lbl-t{display:none}
  .theme-btn{margin-top:0;order:4}
  .nav .lbl-t{display:none}
  .side .cta{order:5;margin-left:auto}
  .side .cta .lbl-t{display:none}
  .side .cta{width:40px;min-width:40px;padding:0;justify-content:center}
  .side{flex-wrap:nowrap}
}

/* generic */
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.01em;line-height:1.1}
.h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.005em}
.muted{color:var(--ink3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn.lg{min-height:46px;padding:0 20px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--ink3)}
.ibtn:hover{background:var(--surface2);color:var(--ink)}
.ibtn:disabled{opacity:.3;cursor:default;background:transparent}
.ibtn.warn{color:var(--bad)}
.inp,.sel,.ta{width:100%;min-width:0;height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 11px;font-size:14px}
.ta{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.inp::placeholder,.ta::placeholder{color:var(--ink3);opacity:.8}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:600;color:var(--ink2)}
.fhint{font-size:11.5px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.numbox{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:8px;background:var(--surface);overflow:hidden;height:40px}
.numbox:focus-within{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.numbox input{flex:1;min-width:0;border:0;background:transparent;padding:0 10px;font-family:var(--f-mono);font-size:14px;outline:none;-moz-appearance:textfield}
.numbox input::-webkit-outer-spin-button,.numbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numbox .suf{display:flex;align-items:center;padding:0 9px;color:var(--ink3);font-size:12px;background:var(--surface2);border-left:1px solid var(--line)}
.numbox .stp{width:30px;border:0;background:var(--surface2);color:var(--ink2);font-size:16px;line-height:1}
.numbox .stp:hover{background:var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink2);font-size:13px;font-weight:500;line-height:1.2;text-align:left}
.pill:hover{border-color:var(--ink3);color:var(--ink)}
.pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.pill .hint{font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-weight:400}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:9px}
.seg button{min-height:30px;padding:0 12px;border-radius:7px;border:0;background:transparent;color:var(--ink3);font-size:12.5px;font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chk{display:flex;align-items:center;gap:10px;min-height:36px;cursor:pointer;font-size:13.5px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.chk .hint{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3);margin-left:auto}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.divider{height:1px;background:var(--line)}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}

/* dashboard */
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-deco{position:absolute;right:210px;top:50%;transform:translateY(-50%);width:150px;height:170px;color:var(--accent);opacity:.18;pointer-events:none}
@media (max-width:1100px){.hero-deco{display:none}}
.hero > *:not(.hero-deco){position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3)}
.row-list{display:flex;flex-direction:column}
.row-item{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row-item:last-child{border-bottom:0}
.row-item:hover{background:var(--surface2)}
@media (max-width:640px){.row-item{grid-template-columns:minmax(0,1fr) auto}.row-item .hide-sm{display:none}}

/* offers table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search svg{position:absolute;left:11px;top:11px;color:var(--ink3)}
.search .inp{padding-left:34px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.click:hover{background:var(--surface2);cursor:pointer}
.tbl .inp,.tbl .sel{height:34px;font-size:13px}
.tbl .numbox{height:34px}
.tbl .numbox input{font-size:13px}

/* editor */
.ed-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:16px}
.ed-title{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.ed-title .t{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:none;border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--ink3)}
.total-box{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.total-box .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--accent-t)}
.status-sel{height:32px;border-radius:999px;border:1px solid var(--line2);padding:0 28px 0 12px;font-size:12.5px;font-weight:600;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.ed-grid{display:grid;grid-template-columns:276px minmax(0,1fr) 372px;gap:16px;align-items:start}
@media (max-width:1359px){.ed-grid{grid-template-columns:260px minmax(0,1fr)}.cfg{grid-column:1 / -1}}
@media (max-width:860px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:14px}
.pos-list{display:flex;flex-direction:column;gap:6px;padding:10px}
.pos{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;background:var(--surface);transition:border-color .15s,background .15s}
.pos.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pos-main{flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:8px;border:0;background:transparent;text-align:left}
.pos-thumb{width:52px;height:56px;flex:none;border-radius:6px;background:var(--stage);display:grid;place-items:center;padding:3px}
.pos-thumb svg{width:100%;height:100%}
.pos-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.pos-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-meta{font-size:11.5px;color:var(--ink3)}
.pos-price{font-size:12.5px;font-weight:500}
.pos-act{display:flex;flex-direction:column;justify-content:center;padding:2px}
.pos-act .ibtn{width:28px;height:26px}
.recap{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.recap .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.recap .ln span:first-child{color:var(--ink2)}
.recap .grand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:2px}
.recap .grand .v{font-family:var(--f-display);font-weight:700;font-size:21px;color:var(--accent-t);font-variant-numeric:tabular-nums}
.stage-card{overflow:hidden}
.stage-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.stage-top .inp{flex:1 1 120px;min-width:0;width:auto;font-weight:700;font-size:15px;background:var(--surface2);border-color:transparent}
.poz-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent);padding:5px 8px;border-radius:6px;white-space:nowrap}
.stage{padding-top:56px!important;position:relative;background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;padding:18px;display:flex;align-items:center;justify-content:center}
.stage > svg{width:100%;height:clamp(320px,54vh,580px);display:block}
.stage-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.stage-foot b{color:var(--ink);font-weight:600}
.legend{display:inline-flex;align-items:center;gap:6px}
.warns{margin:0 14px 14px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.warns div{display:flex;gap:8px;align-items:flex-start}
.warns.err{background:var(--bad-soft);color:var(--bad)}
.warns + .warns{margin-top:-6px}
.ferr{font-size:11.5px;color:var(--bad);font-weight:600}
.numbox.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

const STAT_KEYS = ['sMaxKg', 'skg', 'sRatio', 'mMax'];
function sysStat(s) {
  s = s || {};
  if (STAT_KEYS.every(k => num(s[k], NaN) > 0)) return s;
  const D = defaultPrices().systems;
  const d = D.find(x => x.id === s.id) || (s.mat === 'ALU' ? D.find(x => x.id === 'alm67') : num(s.depth, 70) >= 76 ? D.find(x => x.id === 'sal82') : D.find(x => x.id === 'al4000'));
  const o = Object.assign({}, s);
  STAT_KEYS.forEach(k => { if (!(num(o[k], NaN) > 0)) o[k] = d[k]; });
  return o;
}
// Najveća površina fiksnog stakla bez stuba ili prečke (m²), iz cenovnika ili procena po težini paketa
function glassMaxA(gl) {
  const a = num(gl && gl.maxA, NaN); if (a > 0) return a;
  const D = defaultPrices().glass.find(x => x.id === (gl && gl.id));
  return D ? D.maxA : (glassKg(gl) >= 30 ? 5 : 3.5);
}
// Težina stakla u kg/m²: iz cenovnika, ili iz sastava (npr. 4-16-4 → 8 mm stakla × 2,5 kg)
function glassKg(gl) {
  const k = num(gl && gl.kg, NaN); if (k > 0) return k;
  const m = String((gl && gl.name) || '').match(/\d+(?:[.,]\d+)?(?:-\d+(?:[.,]\d+)?){2,}/);
  if (m) { const mm = m[0].split('-').map(x => parseFloat(x.replace(',', '.')) || 0).filter((_, i) => i % 2 === 0).reduce((a, b) => a + b, 0); if (mm > 0) return Math.round(mm * 2.5 * 10) / 10; }
  return num(gl && gl.thick, 24) >= 30 ? 30 : 20;
}

      ${key === 'rb' ? html`<g transform=${`rotate(-90 ${x + fs * 0.45} ${(y1 + y2) / 2})`}><text x=${x + fs * 0.45} y=${(y1 + y2) / 2} text-anchor="middle" dy="0.9em" style=${textSt}>${label}</text></g>` : lab(x + fs * 0.45, (y1 + y2) / 2, label, key, title, true)}</g>`;
    const y1 = g.H + sill + fs * 1.5;
    if (g.n > 1) {
      let b = [0];
      const ax = g.grid ? g.colAxis : g.fAxis;
      if (ax) { let acc = 0; ax.forEach(w => { acc += w; b.push(acc); }); }
      else { for (let i = 1; i < g.n; i++) b.push(FR + i * (g.lw + MU) - MU / 2); b.push(g.W); }
      for (let j = 0; j < b.length - 1; j++) {
        let a = b[j], c = b[j + 1];
        if (mirror) { const a2 = g.W - c, c2 = g.W - a; a = a2; c = c2; }
        dimEls.push(hdim(a, c, y1, String(Math.round(b[j + 1] - b[j])), 'f' + j, (g.grid ? 'Širina kolone ' : 'Širina polja ') + (j + 1)));
      }
    }
    dimEls.push(hdim(0, g.W, g.n > 1 ? y1 + fs * 1.75 : y1, String(g.W), 'tw', 'Ukupna širina'));
    const vx = g.W + fs * 0.9;
    dimEls.push(vdim(vx, 0, g.H, String(g.H), 'th', 'Ukupna visina'));
    if (rb) dimEls.push(vdim(vx, -rb, 0, String(Math.round(rb)), 'rb', 'Kutija roletne'));
    if (g.T > 0) {
      dimEls.push(vdim(vx + fs * 1.8, 0, g.T, String(Math.round(g.T)), 't1', 'Visina nadsvetla'));
      dimEls.push(vdim(vx + fs * 1.8, g.T, g.H, String(Math.round(g.H - g.T)), 't2', 'Visina donjeg dela'));
    }
    if (rowDims) {
      let yy = 0;
      rowList.forEach((hh, k) => {
        const isTop = g.topH > 0 && k === 0, isBot = g.botH > 0 && k === rowList.length - 1, ri = k - (g.topH > 0 ? 1 : 0);
        dimEls.push(vdim(vx + fs * 1.8, yy, yy + hh, String(Math.round(hh)), isTop ? 'top' : isBot ? 'bot' : `r${dimCol}_${ri}`, isTop ? 'Visina svetlarnika iznad' : isBot ? 'Visina svetlarnika ispod' : `Visina reda ${ri + 1} (kolona ${dimCol + 1})`));

  }

  // alat za crtanje stuba / prečke

    const X = v => mirror ? g.W - v : v;

    let guide = null;

      const x1 = X(L.x1), x2 = X(L.x2);
      const bx = vert ? x1 - MU / 2 : Math.min(x1, x2), by = vert ? L.y1 : L.y1 - MU / 2;

        <line x1=${x1} y1=${L.y1} x2=${x2} y2=${L.y2} style=${`stroke:${col}`} stroke-width="2" stroke-dasharray="8 5" vector-effect=${NS}/>
        ${ga != null ? (vert
          ? html`${lbl(x1 - fs * 0.7, hov.y, '← ' + left, 'end')}${lbl(x1 + fs * 0.7, hov.y, right + ' →', 'start')}`

      </g>`;
    }
    const msg = pl && !pl.ok && pl.msg ? html`<text x=${X(hov.x)} y=${Math.max(fs, hov.y - fs * 1.4)} text-anchor="middle" pointer-events="none" style=${`font-family:var(--f-body),sans-serif;font-size:${fs * 0.8}px;font-weight:600;fill:#B9342A;paint-order:stroke;stroke:#FFFFFF;stroke-width:${fs * 0.35}px`}>${pl.msg}</text>` : null;
    drawEls = html`${guide}${msg}
      <rect class="draw-hit" x="0" y="0" width=${g.W} height=${g.H} fill="transparent" style=${`cursor:${draw.dir === 'v' ? 'col-resize' : 'row-resize'}`}
        onPointerMove=${e => { const q = toModel(e); if (q) setHov(q); }}
        onPointerLeave=${() => setHov(null)}
        onClick=${e => { e.stopPropagation(); const q = toModel(e); if (q) draw.onAdd(q.x, q.y); }}><title>${draw.dir === 'v' ? 'Klik postavlja stub' : 'Klik postavlja prečku'}</title></rect>`;
  }

  let dragEls = null;
  if (drag) {
    const Sc = g.cells[drag.sK], SR = mr(Sc.sash || Sc);
    const parts = [html`<rect x=${SR.x} y=${SR.y} width=${SR.w} height=${SR.h} fill="#1C232B" fill-opacity="0.28" stroke="#1C232B" stroke-width="1.5" stroke-dasharray="6 4" vector-effect=${NS} pointer-events="none"/>`];
    if (drag.tK >= 0) {
      const Tc = g.cells[drag.tK], TR = Tc.sash || Tc, col = drag.ok ? accent : '#D93A2F';
      const e = Math.max(MU, Math.min(TR.w, TR.h) * 0.16);
      const zr = drag.zone === 'l' ? { x: TR.x, y: TR.y, w: e, h: TR.h } : drag.zone === 'r' ? { x: TR.x + TR.w - e, y: TR.y, w: e, h: TR.h }

      const Z = mr(zr), T2 = mr(TR);

      parts.push(html`<rect class="drop-zone" x=${Z.x} y=${Z.y} width=${Z.w} height=${Z.h} style=${`fill:${col}`} fill-opacity=${drag.zone === 'c' ? 0.2 : 0.55} pointer-events="none"/>`);

      parts.push(html`<text class="drop-label" x=${X} y=${Math.max(fs, drag.q.y - fs * 1.1)} text-anchor=${anc} pointer-events="none" style=${`font-family:var(--f-body),sans-serif;font-size:${fs * 0.85}px;font-weight:700;fill:${drag.ok ? '#1C232B' : '#B9342A'};paint-order:stroke;stroke:#FFFFFF;stroke-width:${fs * 0.4}px;stroke-linejoin:round`}>${viewLbl(drag.label)}</text>`);

  }

  return html`<svg ref=${svgRef} class=${cls + (drag ? ' dragging' : '')} viewBox=${vb}
    onPointerMove=${onMove ? dragMove : null} onPointerUp=${onMove ? e => dragEnd(e, false) : null} onPointerCancel=${onMove ? e => dragEnd(e, true) : null}
    onClickCapture=${onMove ? e => { if (dragRef.current.just) { e.stopPropagation(); e.preventDefault(); } } : null} preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label=${`Crtež: ${g.W} × ${g.H} mm`}>
    <defs>
      <linearGradient id=${id + 'g'} x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color=${p.satin ? '#F6F8F9' : '#E6F1F6'}/>
        <stop offset="1" stop-color=${p.satin ? '#D8DFE3' : '#B4CEDB'}/>
      </linearGradient>
      <pattern id=${id + 'm'} width=${ms} height=${ms} patternUnits="userSpaceOnUse">
        <path d=${`M0 0H${ms}M0 0V${ms}`} stroke="#1C232B" stroke-opacity="0.16" stroke-width="0.6" fill="none" vector-effect=${NS}/>
      </pattern>
    </defs>
    ${rb ? html`<rect x="0" y=${-rb} width=${g.W} height=${rb} fill=${fill} stroke=${edge} stroke-width="1" vector-effect=${NS}/>
      <line x1=${FR} y1=${-rb * 0.32} x2=${g.W - FR} y2=${-rb * 0.32} stroke=${edge} stroke-opacity="0.5" stroke-width="0.8" vector-effect=${NS}/>` : null}
    ${mirror && p.sillOut ? html`<rect x="-45" y=${g.H} width=${g.W + 90} height=${sill} fill="#A3AAB0" stroke="#737B83" stroke-width="1" vector-effect=${NS}/>` : null}
    ${!mirror && p.sillIn ? html`<rect x="-25" y=${g.H} width=${g.W + 50} height=${sill} fill="#FBFBF9" stroke="#A9AFB4" stroke-width="1" vector-effect=${NS}/>` : null}
    <rect x="0" y="0" width=${g.W} height=${g.H} fill=${fill} stroke=${edge} stroke-width="1.2" vector-effect=${NS}/>
    ${cells}
    ${dragEls}
    ${drawEls}
    ${dimEls}
  </svg>`;
}

// Srazmerno uklapa listu mera u novi zbir; ako postoji bar jedna „auto“ mera, ona upija razliku pa se ništa ne menja
function fitList(list, key, total, force) {
  if (!list.length || !(total > 0)) return;
  if (force) list.forEach(x => { if (!(num(x[key], NaN) > 0)) x[key] = 500; });
  if (!list.every(x => num(x[key], NaN) > 0)) return;
  const sum = list.reduce((a, x) => a + num(x[key], 0), 0); if (!(sum > 0)) return;
  let acc = 0;
  list.forEach((x, i) => { if (i < list.length - 1) { x[key] = Math.round(num(x[key], 0) * total / sum); acc += x[key]; } else x[key] = Math.round(total - acc); });
}
function resizeTotal(p, axis, v) {
  p[axis] = v;
  const n = num(v, NaN);
  if (!isGrid(p) || !p.grid || !(n > 0)) return;
  if (axis === 'w') { fitList(p.grid.cols, 'w', n); ['top', 'bottom'].forEach(k => { if (p.grid[k] && Array.isArray(p.grid[k].parts)) fitList(p.grid[k].parts, 'w', n); }); }
  else { const band = (p.grid.top ? num(p.grid.top.h, 0) : 0) + (p.grid.bottom ? num(p.grid.bottom.h, 0) : 0); p.grid.cols.forEach(c => fitList(c.rows, 'h', n - band)); }
}

function useTween(v) {
  const [d, setD] = useState(v); const ref = useRef(v);
  useEffect(() => {

    const step = t => { const k = Math.min(1, (t - t0) / 420); const e = 1 - Math.pow(1 - k, 3); const val = from + (to - from) * e; ref.current = val; setD(val); if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);

  }, [v]);

}

const TRANSLIT = { č: 'c', ć: 'c', š: 's', ž: 'z', đ: 'dj', Č: 'C', Ć: 'C', Š: 'S', Ž: 'Z', Đ: 'Dj' };
const pdfName = o => (`Ponuda ${o.no}${o.client.name ? ' - ' + o.client.name : ''}`)
  .replace(/[čćšžđČĆŠŽĐ]/g, ch => TRANSLIT[ch])
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^A-Za-z0-9 ._-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) + '.pdf';

function PdfCapture({ job, data, onDone, onProgress }) {
  const ref = useRef(null);
  const o = data.offers.find(x => x.id === job.offerId);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const imgs = [...ref.current.querySelectorAll('img')];
        await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
        if (!window.jspdf || !window.html2canvas) throw new Error('PDF biblioteke nisu učitane. Proverite internet vezu i pokušajte ponovo.');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        const pages = ref.current.querySelectorAll('.pdf-page');
        for (let i = 0; i < pages.length; i++) {
          if (onProgress) onProgress(i + 1, pages.length);
          const c = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
          if (i) pdf.addPage();
          pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
        }
        pdf.setProperties({ title: 'Ponuda ' + o.no, subject: 'Ponuda za stolariju', creator: data.settings.company.name });
        const res = await saveFile(pdfName(o), pdf.output('blob'));
        if (alive) onDone({ ok: true, res, offerId: o.id });
      } catch (e) { if (alive) onDone({ ok: false, err: e && e.message ? e.message : 'PDF nije napravljen.' }); }
    })();
    return () => { alive = false; };
  }, []);
  if (!o) return null;
  return html`<div class="capture" ref=${ref} aria-hidden="true"><${PdfDoc} o=${o} data=${data}/></div>`;
}

function PdfPreview({ o, data }) {
  const ref = useRef(null);
  const [w, setW] = useState(700);
  useEffect(() => {
    if (!ref.current) return;
    // Merenje se odlaže na sledeći frejm i ignoriše sitne promene, da promena razmere
    // stranica ne bi ponovo okinula posmatrač u istom ciklusu (ResizeObserver loop)
    let raf = 0;
    const ro = new ResizeObserver(es => {
      const nw = Math.round(es[es.length - 1].contentRect.width);
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setW(prev => Math.abs(prev - nw) > 4 ? nw : prev));
    });
    ro.observe(ref.current);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);
  const sc = clamp((w - 40) / 794, 0.3, 1);
  const pages = PdfDoc({ o, data });
  const list = Array.isArray(pages) ? pages : [pages];
  return html`<div class="pdf-stack" ref=${ref}>
    ${(list.flat ? list.flat() : list).map((pg, i) => html`<div class="pdf-scaler" key=${i} style=${`width:${794 * sc}px;height:${1123 * sc}px`}><div style=${`transform:scale(${sc});width:794px`}>${pg}</div></div>`)}
  </div>`;
}

      <div class="card-b"><${PresetGrid} P=${P} onPick=${addPreset}/></div>
    </div></div>` : null;

  if (ui.tab === 'client') return html`<div>${head}${ClientTab({ o, upO, S })}</div>`;
  if (ui.tab === 'pdf') return html`<div>${head}
    <div class="pdf-wrap">
      <${PdfPreview} o=${o} data=${data}/>
      <div class="card" style="position:sticky;top:16px">
        <div class="card-h"><h2 class="h2">Slanje kupcu</h2></div>
        <div class="card-b" style="display:flex;flex-direction:column;gap:14px">
          <div class="checklist">
            ${errs.map(e => html`<div><span style="color:var(--bad)">${Icon.warn()}</span><span>Pozicija ${e.i + 1}: mere van dozvoljenih granica</span></div>`)}
            ${missing.map(t => html`<div><span class="no-i">${Icon.warn()}</span><span>Nedostaje: ${t}</span></div>`)}
            ${!missing.length && !errs.length ? html`<div><span class="ok-i">${Icon.check()}</span><span>Ponuda je kompletna i spremna za slanje.</span></div>` : null}
          </div>
          <${Field} label="Valuta u ponudi"><${Seg} label="Valuta" items=${[{ id: 'EUR', label: 'EUR' }, { id: 'RSD', label: 'RSD' }]} value=${o.currency} onChange=${v => upO(x => { x.currency = v; })}/><//>
          <button class="btn primary lg" onClick=${() => exportPdf(o.id)} disabled=${!o.positions.length}>${Icon.pdf()} Preuzmi PDF</button>
          <p class="muted" style="margin:0;font-size:12px">Fajl: ${pdfName(o)}</p>
        </div>
      </div>
    </div></div>`;

  if (!o.positions.length) return html`<div>${head}
    <div class="card"><div class="card-h"><div><h2 class="h2">Dodajte prvu poziciju</h2><div class="muted" style="font-size:12.5px">Izaberite tip i šablon koji je najbliži, sve ostalo se menja u konfiguratoru.</div></div></div>
    <div class="card-b"><${PresetGrid} P=${P} onPick=${addPreset}/></div></div></div>`;

  const rail = html`<aside class="rail">
    <div class="card">
      <div class="card-h"><h2 class="h2">Pozicije</h2><button class="btn primary sm" onClick=${() => set({ presets: true })}>${Icon.plus()} Dodaj</button></div>
      <div class="pos-list">

          <button class="pos-main" aria-pressed=${on} title=${on ? 'Klik ponovo poništava izbor (Esc)' : ''} onClick=${() => set(on ? { pid: '', af: -1 } : { pid: p.id, af: 0 })}>

            <span class="pos-txt">

            </span>
          </button>
          <div class="pos-act">
            ${armed === p.id ? html`<button class="btn danger sm" style="margin:4px" onClick=${() => delPos(p)}>Obriši?</button>` : html`
            <button class="ibtn" aria-label="Pomeri gore" title="Pomeri gore" disabled=${i === 0} onClick=${() => move(p.id, -1)}>${Icon.up()}</button>
            <button class="ibtn" aria-label="Kopiraj poziciju" title="Kopiraj" onClick=${() => dupPos(p)}>${Icon.copy()}</button>
            <button class="ibtn warn" aria-label="Obriši poziciju" title="Obriši" onClick=${() => delPos(p)}>${Icon.trash()}</button>
            <button class="ibtn" aria-label="Pomeri dole" title="Pomeri dole" disabled=${i === o.positions.length - 1} onClick=${() => move(p.id, 1)}>${Icon.down()}</button>`}
          </div>
        </div>`; })}
      </div>
    </div>
    <div class="card recap">
      <h2 class="h2" style="margin-bottom:2px">Rekapitulacija</h2>
      <div class="ln"><span>Vrednost (${T.count} kom)</span><span class="mono">${m(T.net)}</span></div>
      <div class="ln"><label for="disc">Rabat</label><span style="width:92px"><${NumBox} id="disc" value=${o.discount} min=${0} max=${50} onChange=${v => upO(x => { x.discount = v; })} suffix="%"/></span></div>
      ${T.disc > 0 ? html`<div class="ln"><span>Popust</span><span class="mono">−${m(T.disc)}</span></div>` : null}
      <div class="ln"><span>Osnovica</span><span class="mono">${m(T.osn)}</span></div>
      <div class="ln"><span>PDV ${fN(S.offer.pdv)}%</span><span class="mono">${m(T.pdv)}</span></div>
      <div class="grand"><b>Za uplatu</b><span class="v">${m(T.grand)}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px"><span class="muted" style="font-size:12px">Valuta</span><${Seg} label="Valuta" items=${[{ id: 'EUR', label: 'EUR' }, { id: 'RSD', label: 'RSD' }]} value=${o.currency} onChange=${v => upO(x => { x.currency = v; })}/></div>
    </div>
  </aside>`;

  // ── nijedna pozicija nije izabrana: pregled cele ponude ──
  if (!pos) return html`<div>${head}${presetModal}
    <div class="ed-grid">${rail}
      <section class="card wide">
        <div class="card-h"><div><h2 class="h2">Sve pozicije</h2><div class="muted" style="font-size:12.5px">Nijedna pozicija nije izabrana. Kliknite poziciju da je uredite.</div></div><button class="btn primary sm" onClick=${() => set({ presets: true })}>${Icon.plus()} Dodaj</button></div>
        <div class="card-b overview">${o.positions.map((p, i) => { const rr = T.items[i]; return html`
          <button type="button" class=${'ov-card' + (rr.errors.length ? ' bad' : '')} onClick=${() => set({ pid: p.id, af: 0 })}>
            <span class="ov-pv">${rr.item ? html`<span style="color:var(--ink3)">${Icon.list(30)}</span>` : html`<${WindowSVG} p=${p} P=${P} dims=${false}/>`}</span>
            <span class="pos-meta mono">POZ. ${i + 1} · ${(TYPES[p.type] || TYPES.win).label.toUpperCase()}</span>
            <b>${rr.errors.length ? html`<span class="pos-err">!</span>` : null}${p.name}</b>
            <span class="pos-meta mono">${rr.item ? fN(rr.qty) + ' ' + (p.unit || 'kom') : rr.g.W + ' × ' + rr.g.H + ' mm · ' + rr.qty + ' kom'}</span>
            <span class="mono" style="font-weight:600">${m(rr.total)}</span>
          </button>`; })}</div>
      </section>
    </div></div>`;

  // ── ručna stavka ──
  if (r.item) return html`<div>${head}${presetModal}
    <div class="ed-grid">${rail}
      <section class="card wide">
        <div class="stage-top"><span class="poz-tag">POZ. ${posIdx + 1}</span><span class="type-chip">${Icon.list(15)} Ručna stavka</span><span style="flex:1"></span><button class="ibtn" aria-label="Zatvori poziciju" title="Zatvori poziciju (Esc)" onClick=${() => set({ pid: '', af: -1 })}>${Icon.close()}</button></div>
        <div class="card-b" style="display:flex;flex-direction:column;gap:14px;max-width:760px">
          <p class="muted" style="margin:0;font-size:13px">Za sve što nema crtež: garažna vrata, servis, prevoz, posebna izrada. U PDF-u se prikazuju naziv, opis, količina i cena.</p>
          <${Field} label="Naziv stavke"><input id="iname" class="inp" value=${pos.name} onInput=${e => setP({ name: e.target.value })}/><//>
          <${Field} label="Opis za kupca" hint="Ispisuje se u ponudi ispod naziva."><textarea id="idesc" class="ta" value=${pos.desc} placeholder="npr. Sekciona garažna vrata 2500 × 2125 mm, motorni pogon, 2 daljinska" onInput=${e => setP({ desc: e.target.value })}></textarea><//>
          <div class="grid3">
            <${Field} label="Jedinica mere"><${Seg} label="Jedinica" items=${UNITS.map(u => ({ id: u, label: u }))} value=${pos.unit || 'kom'} onChange=${v => setP({ unit: v })}/><//>
            <${Field} label="Količina"><${NumBox} id="iq" value=${pos.qty} step=${1} min=${0} steppers onChange=${v => setP({ qty: v })} suffix=${pos.unit || 'kom'}/><//>
            <${Field} label="Cena po jedinici" error=${num(pos.price, 0) > 0 ? '' : 'Unesite cenu'}><${NumBox} id="ip" value=${pos.price} step=${1} min=${0} bad=${!(num(pos.price, 0) > 0)} onChange=${v => setP({ price: v })} suffix="€ bez PDV"/><//>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px solid var(--line)"><b>Ukupno stavka (bez PDV)</b><span class="mono" style="font-size:18px;font-weight:500">${m(r.total)}</span></div>
        </div>
      </section>
    </div></div>`;

  // ── pozicije sa crtežom ──
  const grid = isGrid(pos);
  const STEPS = grid ? STEPS_GRID : STEPS_WIN;
  const step = ui.step;
  const LT = limitFor(P, 'types', typeLimitId(pos)) || { wMin: 0, wMax: 99999, hMin: 0, hMax: 99999 };
  const wBad = !inRange(num(pos.w, 0), LT.wMin, LT.wMax), hBad = !inRange(num(pos.h, 0), LT.hMin, LT.hMax);
  const depths = [...new Set(P.systems.filter(s => s.mat === sys.mat).map(s => num(s.depth, 0)))].sort((a, b) => a - b);
  const mainCells = r.g.cells.filter(c => c.kind === 'main');
  const openMain = mainCells.filter(c => c.open && !c.door).length;
  const openList = OPEN_BY_TYPE[pos.type] || OPEN_BY_TYPE.win;
  const limErrs = r.limitErrors;
  const hasGlass = r.g.Ag > 0.0001;
  const nextStep = d => { let n = step + d; if (n === 2 && !hasGlass) n += d; return clamp(n, 0, STEPS.length - 1); };

  const openPicker = (cur, onPick) => html`<div class="open-grid">${openList.map(code => {
    const on = cur === code;
    const grpId = (code === 'doorL' || code === 'doorD') ? 'edoor' : (pos.type === 'door' && code !== 'fix') ? 'bdoor' : OPEN[code].grp;
    const pr = (code === 'doorL' || code === 'doorD') ? num(P.extras.shopDoor, 0) : num(P.openings[OPEN[code].grp], 0) + ((pos.type === 'door' && code !== 'fix') ? num(P.extras.door, 0) : 0);
    const L = limitFor(P, 'cells', grpId);
    return html`<button type="button" class=${'open-btn' + (on ? ' on' : '')} aria-pressed=${on} title=${L ? `${L.name}: najmanje ${fN(L.wMin)} × ${fN(L.hMin)} mm` : ''} onClick=${() => onPick(code)}>
      <${OpenGlyph} code=${code}/><span class="t">${OPEN[code].short}</span><span class="p">${pr ? '+' + fN(pr) + ' €' : 'u ceni'}</span>
    </button>`;
  })}</div>`;

  // ── uređivač konstrukcije (izlog / slobodna pozicija) ──
  // ── izmena mera klikom na kotu na crtežu ──
  const openDim = ({ key, title, value, el }) => {
    const st = stageRef.current; if (!st) return;
    const a = el.getBoundingClientRect(), b = st.getBoundingClientRect();
    const below = a.top - b.top < 110;
    const hint = key === 'tw' || key === 'th' ? (grid ? 'Kolone i redovi sa upisanom merom se srazmerno prilagode.' : '')
      : key === 'top' || key === 'bot' || key[0] === 'r' || key[0] === 'f' ? 'Ostala polja na „auto“ preuzimaju razliku. Ako ih nema, menja se ukupna mera.'
      : key === 't1' || key === 't2' ? 'Ukupna visina ostaje ista.' : '';
    set({ dim: { pid: pos.id, key, title, value, hint, below, left: clamp(a.left + a.width / 2 - b.left, Math.min(155, b.width / 2), Math.max(b.width - 155, b.width / 2)), top: below ? a.bottom - b.top + 8 : a.top - b.top - 8 } });
  };
  const applyDim = (key, raw) => {
    const v = Math.round(num(raw, NaN));
    if (!(v > 0)) { notify('Unesite meru u milimetrima.', 'bad'); return false; }
    upP(p => {
      if (key === 'tw') return resizeTotal(p, 'w', String(v));
      if (key === 'th') return resizeTotal(p, 'h', String(v));
      if (key === 't1') { p.transomH = v; return; }
      if (key === 't2') { p.transomH = Math.max(0, num(p.h, 0) - v); return; }
      if (key === 'top' || key === 'bot') {
        p.grid[key === 'top' ? 'top' : 'bottom'].h = v;
        const hasAuto = p.grid.cols.some(c => c.rows.some(r2 => !(num(r2.h, NaN) > 0)));
        if (!hasAuto) p.h = (p.grid.top ? num(p.grid.top.h, 0) : 0) + (p.grid.bottom ? num(p.grid.bottom.h, 0) : 0) + p.grid.cols[0].rows.reduce((s2, r2) => s2 + num(r2.h, 0), 0);
        return;
      }
      if (key[0] === 'f') {
        const j = +key.slice(1);
        if (isGrid(p)) {
          p.grid.cols[j].w = v;
          if (p.grid.cols.every(c => num(c.w, NaN) > 0)) p.w = p.grid.cols.reduce((s2, c) => s2 + num(c.w, 0), 0);
        } else {
          const fw = (Array.isArray(p.fw) ? p.fw.slice(0, p.fields.length) : []); while (fw.length < p.fields.length) fw.push('');
          fw[j] = v; p.fw = fw;
          if (fw.every(x => num(x, NaN) > 0)) p.w = fw.reduce((s2, x) => s2 + num(x, 0), 0);
        }
        return;
      }
      if (key[0] === 'r') {
        const [ci, ri] = key.slice(1).split('_').map(Number);
        const rows = p.grid.cols[ci].rows; rows[ri].h = v;
        if (rows.every(r2 => num(r2.h, NaN) > 0)) p.h = rows.reduce((s2, r2) => s2 + num(r2.h, 0), 0) + (p.grid.top ? num(p.grid.top.h, 0) : 0) + (p.grid.bottom ? num(p.grid.bottom.h, 0) : 0);
      }
    });
    return true;
  };
  const noFieldHint = html`<div class="type-box"><b style="font-size:13.5px">Nijedno polje nije izabrano</b><span class="fhint">Kliknite polje na crtežu ili u listi iznad da podesite njegovo otvaranje${grid ? ', mere i ispunu' : ''}. Ponovni klik na isto polje ili Esc poništava izbor.</span></div>`;
  // ── stub i prečka: crtanjem na crtežu ili brzom podelom polja ──
  const doBar = (dir, x, y) => {
    const pl = barPlan(pos, dir, x, y);
    if (!pl.ok) { if (pl.msg) notify(pl.msg, 'bad'); return; }
    upP(p => { addBar(p, dir, x, y); });
    set({ af: -1, dim: null });
    notify(pl.convert ? 'Prozor je prebačen u slobodnu poziciju, da bi prečka delila samo izabrano polje.' : (dir === 'v' ? 'Dodat stub' : 'Dodata prečka') + ` · ${Math.round(pl.a)} + ${Math.round(pl.b)} mm`);
  };
  const moveField = (sK, tK, zone, dry) => {
    if (dry) return moveCell(clone(pos), sK, tK, zone);
    const res = moveCell(clone(pos), sK, tK, zone);
    if (!res.ok) { if (res.msg) notify(res.msg, 'bad'); return res; }
    upP(p => { moveCell(p, sK, tK, zone); });
    set({ af: -1, dim: null });
    notify(res.label + (res.convert ? ' · pozicija sada ima slobodnu podelu na kolone i redove' : ''));
    return res;
  };
  const splitFix = k => {
    const tmp = clone(pos), res = splitCell(tmp, k);
    if (!res.ok) { notify(res.msg || 'Polje nije moguće podeliti.', 'bad'); return; }
    upP(p => { splitCell(p, k); });
    set({ af: -1, dim: null });
    notify(res.convert ? 'Prozor je prebačen u slobodnu poziciju i polje je podeljeno.' : 'Polje je podeljeno ' + (/V$/.test(res.op) ? 'stubom' : 'prečkom') + ` · ${Math.round(res.a)} + ${Math.round(res.b)} mm`);
    const el = stageRef.current;
    if (el && el.getBoundingClientRect) { const b = el.getBoundingClientRect(); if (b.bottom < 60 || b.top > window.innerHeight - 60) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  };
  const st = r.stat;
  const statOf = i => st.cells.find(c => c.kind === 'main' && c.idx === i);
  const kgTxt = c => c ? `≈ ${Math.round(c.kg)} kg${c.limKg ? ' (najviše ' + fN(c.limKg) + ' kg)' : ''}` : '';
  const statFixes = st.cells.filter(c => c.bad.length);
  // Brze ispravke kada zbir kolona/redova ne odgovara ukupnoj meri
  const gridFixes = [];
  if (grid && pos.grid) {
    const G = pos.grid, Wt = num(pos.w, 0), Ht = num(pos.h, 0), topH = (G.top ? num(r.g.topH, 0) : 0) + (G.bottom ? num(r.g.botH, 0) : 0);
    const ws = G.cols.map(c => num(c.w, NaN)), known = ws.filter(v => v > 0).reduce((a, b) => a + b, 0), autoN = ws.filter(v => !(v > 0)).length;
    if ((!autoN && Math.abs(known - Wt) > 0.5) || (autoN && Wt - known < 150 * autoN)) {
      const target = autoN ? known + autoN * 500 : known;
      gridFixes.push({ title: `Širina: kolone ${Math.round(known)} mm${autoN ? ' + ' + autoN + ' automatske' : ''}, pozicija ${Math.round(Wt)} mm.`, acts: [
        { label: `Ukupna širina = ${Math.round(target)} mm`, fn: () => upP(p => { p.w = String(Math.round(target)); }) },
        { label: `Uklopi kolone u ${Math.round(Wt)} mm`, fn: () => upP(p => fitList(p.grid.cols, 'w', Wt, true)) },
        { label: 'Raspodeli ravnomerno', fn: () => upP(p => p.grid.cols.forEach(c => { c.w = ''; })) }
      ] });
    }
    G.cols.forEach((c, ci) => {
      const hs = c.rows.map(rw => num(rw.h, NaN)), kn = hs.filter(v => v > 0).reduce((a, b) => a + b, 0), an = hs.filter(v => !(v > 0)).length, avail = Ht - topH;
      if ((!an && Math.abs(kn - avail) > 0.5) || (an && avail - kn < 150 * an)) {
        const target = (an ? kn + an * 500 : kn) + topH;
        gridFixes.push({ title: `Kolona ${ci + 1}: redovi ${Math.round(kn)} mm${an ? ' + ' + an + ' automatski' : ''}, na raspolaganju ${Math.round(avail)} mm.`, acts: [
          { label: `Ukupna visina = ${Math.round(target)} mm`, fn: () => upP(p => { p.h = String(Math.round(target)); }) },
          { label: `Uklopi redove`, fn: () => upP(p => fitList(p.grid.cols[ci].rows, 'h', avail, true)) },
          { label: 'Ravnomerno', fn: () => upP(p => p.grid.cols[ci].rows.forEach(rw => { rw.h = ''; })) }
        ] });
      }
    });
  }
  // ── svetlarnici: levo, desno, iznad, ispod (prozor i balkonska vrata prelaze na slobodnu podelu) ──
  const SIDE = 400, TOP = 500, BOT = 400;
  const addLight = where => {
    const conv = !isGrid(pos);
    if ((where === 'T' && grid && pos.grid.top) || (where === 'B' && grid && pos.grid.bottom)) return;
    upP(p => {
      toGrid(p);
      const G = p.grid, cell = () => ({ h: '', code: 'fix', fill: 'glass' });
      if (where === 'L') { G.cols.unshift({ w: SIDE, side: true, rows: [cell()] }); p.w = Math.round(num(p.w, 0) + SIDE); }
      if (where === 'R') { G.cols.push({ w: SIDE, side: true, rows: [cell()] }); p.w = Math.round(num(p.w, 0) + SIDE); }
      if (where === 'T' && !G.top) { G.top = { h: TOP, code: 'fix', fill: 'glass' }; p.h = Math.round(num(p.h, 0) + TOP); }
      if (where === 'B' && !G.bottom) { G.bottom = { h: BOT, code: 'fix', fill: 'glass' }; p.h = Math.round(num(p.h, 0) + BOT); }
    });
    // novi svetlarnik ostaje izabran, da mu se odmah podese mere i otvaranje
    const bandN = b => grid && pos.grid[b] ? (Array.isArray(pos.grid[b].parts) && pos.grid[b].parts.length > 1 ? pos.grid[b].parts.length : 1) : 0;
    const topN = grid ? bandN('top') : (pos.transom && r.g.T > 0 ? 1 : 0);
    const colN = grid ? pos.grid.cols.reduce((a, c) => a + c.rows.length, 0) : pos.fields.length;
    set({ af: { L: topN, R: topN + colN, T: 0, B: topN + colN }[where], step: 1, dim: null });
    notify('Dodat svetlarnik ' + { L: 'levo', R: 'desno', T: 'iznad', B: 'ispod' }[where] + (conv ? '. Pozicija sada ima slobodnu podelu na kolone i redove.' : '.'));
  };
  const lightTools = html`<div class="field"><span class="lbl">Svetlarnici</span>
    <div class="grid-tools">
      <button class="btn sm" onClick=${() => addLight('L')}>${Icon.plus()} Levo</button>
      <button class="btn sm" onClick=${() => addLight('T')} disabled=${grid && !!pos.grid.top}>${Icon.plus()} Iznad</button>
      <button class="btn sm" onClick=${() => addLight('B')} disabled=${grid && !!pos.grid.bottom}>${Icon.plus()} Ispod</button>
      <button class="btn sm" onClick=${() => addLight('R')}>${Icon.plus()} Desno</button>
    </div>
    <span class="fhint">Svetlarnik povećava ukupnu meru pozicije (${SIDE} mm sa strane, ${TOP} mm iznad, ${BOT} mm ispod).${grid ? ' Mere menjate ispod ili klikom na kotu.' : ' Prozor tada prelazi na slobodnu podelu na kolone i redove.'}</span>
  </div>`;
  const dragHint = html`<span class="fhint">${Icon.move ? Icon.move() : null} Polje prevucite mišem: pustite ga na sredinu drugog polja da zamene mesta, ili uz njegovu ivicu da ga ubacite levo, desno, iznad ili ispod.</span>`;
  const gridEditor = () => {
    const G = pos.grid;
    const cols = G.cols;
    const flat = [];
    const bandParts = b => G[b] && Array.isArray(G[b].parts) && G[b].parts.length > 1 ? G[b].parts : null;
    const pushBand = b => { if (!G[b]) return; const ps = bandParts(b); if (ps) ps.forEach((t, k) => flat.push({ band: b, k })); else flat.push({ band: b, k: -1 }); };
    pushBand('top');
    cols.forEach((c, ci) => c.rows.forEach((rw, ri) => flat.push({ ci, ri })));
    pushBand('bottom');
    const off = G.top ? (bandParts('top') ? bandParts('top').length : 1) : 0;
    const objOf = f => f.band ? (f.k >= 0 ? G[f.band].parts[f.k] : G[f.band]) : cols[f.ci].rows[f.ri];
    const bandWord = b => b === 'top' ? 'iznad' : 'ispod';
    const common = html`
      ${gridFixes.length ? html`<div class="fixes panel">${gridFixes.map(fx => html`<div class="fix"><span>${fx.title}</span><div class="grid-tools">${fx.acts.map(a => html`<button class="btn sm" onClick=${a.fn}>${a.label}</button>`)}</div></div>`)}</div>` : null}
      ${lightTools}
      <div class="field"><span class="lbl">Polja</span>
        <${Pills} items=${flat.map((f, i) => ({ id: i, label: (i + 1) + ' · ' + (f.band ? (f.band === 'top' ? 'Iznad · ' : 'Ispod · ') : '') + OPEN[objOf(f).code || 'fix'].short }))} value=${af} onChange=${pickField}/>
        ${dragHint}
      </div>
      ${pos.type === 'door' ? html`
        <${Check} checked=${pos.panel} onChange=${v => setP({ panel: v })} label="Parapetni panel u donjem delu krila" hint=${'+' + fN(P.extras.panel) + ' €'}/>
        <${Check} checked=${pos.lowSill} onChange=${v => setP({ lowSill: v })} label="Niski ALU prag (bez barijere)" hint=${'+' + fN(P.extras.lowSill) + ' €'}/>` : null}`;
    if (af < 0) return html`${common}${noFieldHint}
      <${Field} label="Dekorativne prečke u staklu"><${Pills} items=${BARS} value=${pos.bars} onChange=${v => setP({ bars: v })}/><//>`;
    const sel = flat[Math.min(af, flat.length - 1)];
    const band = sel.band || null;
    const col = band ? null : cols[sel.ci];
    const row = objOf(sel);
    const cell = mainCells[Math.min(af, mainCells.length - 1)];
    const idxOf = (ci, ri) => { let k = off; for (let a = 0; a < cols.length; a++) for (let b = 0; b < cols[a].rows.length; b++) { if (a === ci && b === ri) return k; k++; } return 0; };
    const colAx = band ? 0 : Math.round(r.g.colAxis[sel.ci]);
    const rowAx = band ? Math.round(band === 'top' ? r.g.topH : r.g.botH) : Math.round(r.g.rowAxis[sel.ci][sel.ri]);
    const bAxis = band ? (band === 'top' ? r.g.topAxis : r.g.botAxis) : null;
    const LC = limitFor(P, 'cells', cellLimitId(pos, cell));
    const dd = cell.sash || cell;
    const addCol = () => { upP(p => { p.grid.cols.splice(sel.ci + 1, 0, { w: '', rows: [{ h: '', code: 'fix', fill: 'glass' }] }); }); set({ af: idxOf(sel.ci, col.rows.length - 1) + 1 }); };
    const addRow = () => { upP(p => { p.grid.cols[sel.ci].rows.splice(sel.ri + 1, 0, { h: '', code: 'fix', fill: 'glass' }); }); set({ af: af + 1 }); };
    const canRemove = flat.length > 1;
    const remove = removePart => {
      if (!canRemove) return;
      upP(p => {
        if (band && sel.k >= 0 && removePart) {
          const B = p.grid[band], ps = B.parts; ps.splice(sel.k, 1);
          if (ps.length < 2) { B.code = ps[0].code || 'fix'; B.fill = ps[0].fill || 'glass'; delete B.parts; }
          else if (ps.every(t => num(t.w, NaN) > 0)) ps[ps.length - 1].w = '';
          return;
        }
        if (band) { p.h = Math.max(300, Math.round(num(p.h, 0) - rowAx)); p.grid[band] = null; return; }
        const c = p.grid.cols[sel.ci];
        if (c.rows.length > 1) c.rows.splice(sel.ri, 1);
        else { if (c.side) p.w = Math.max(300, Math.round(num(p.w, 0) - r.g.colAxis[sel.ci])); p.grid.cols.splice(sel.ci, 1); }
      });
      set({ af: -1 });
    };
    const setRow = patch => upP(p => { const t = band ? (sel.k >= 0 && !('h' in patch) ? p.grid[band].parts[sel.k] : p.grid[band]) : p.grid.cols[sel.ci].rows[sel.ri]; Object.assign(t, patch); });
    const where = band ? (sel.k >= 0 ? `Svetlarnik ${bandWord(band)}, deo ${sel.k + 1} od ${G[band].parts.length}` : `Svetlarnik ${bandWord(band)}, preko cele širine`) : `Kolona ${sel.ci + 1}${col.side ? ' (bočni svetlarnik)' : ''}, red ${sel.ri + 1}`;
    return html`${common}
      <div class="sel-box">
        <div class="sel-head"><span><b>Polje ${af + 1}</b> · ${where} · ${cell.open ? 'krilo' : 'polje'} ${Math.round(dd.w)} × ${Math.round(dd.h)} mm · ${kgTxt(statOf(af))}</span><button class="btn ghost sm" onClick=${() => set({ af: -1 })} title="Poništi izbor polja (Esc)">${Icon.close()} Poništi izbor</button></div>
        ${!band ? html`<div class="grid-tools">
          <button class="btn sm" onClick=${addCol}>${Icon.splitV()} Podeli širinu</button>
          <button class="btn sm" onClick=${addRow}>${Icon.splitH()} Podeli po visini</button>
          <button class="btn sm danger" disabled=${!canRemove} onClick=${() => remove(false)}>${Icon.trash()} Ukloni polje</button>
        </div>` : html`<div class="grid-tools">${sel.k >= 0 ? html`<button class="btn sm danger" onClick=${() => remove(true)}>${Icon.trash()} Ukloni deo</button>` : null}<button class="btn sm danger" disabled=${!canRemove} onClick=${() => remove(false)}>${Icon.trash()} Ukloni svetlarnik ${bandWord(band)}</button></div>`}
        <div class="grid2">
          ${band && sel.k >= 0 ? html`<${Field} label=${'Širina dela ' + (sel.k + 1)} hint=${row.w === '' || row.w == null ? `Automatski · ${Math.round(bAxis[sel.k])} mm` : 'Osna mera · prazno = automatski'}><${NumBox} id="gtw" value=${row.w} placeholder=${'auto (' + Math.round(bAxis[sel.k]) + ')'} step=${10} min=${0} onChange=${v => upP(p => { p.grid[band].parts[sel.k].w = v; })} suffix="mm"/><//>` : null}
          ${!band ? html`<${Field} label=${'Širina kolone ' + (sel.ci + 1)} hint=${col.w === '' || col.w == null ? `Automatski · ${colAx} mm` : `Osna mera · prazno = automatski`}><${NumBox} id="gcw" value=${col.w} placeholder=${'auto (' + colAx + ')'} step=${10} min=${0} onChange=${v => upP(p => { p.grid.cols[sel.ci].w = v; })} suffix="mm"/><//>` : null}
          <${Field} label=${band ? 'Visina svetlarnika' : 'Visina reda ' + (sel.ri + 1)} hint=${band ? (band === 'top' ? 'Osna mera od vrha pozicije' : 'Osna mera od dna pozicije') : (row.h === '' || row.h == null ? `Automatski · ${rowAx} mm` : `Osna mera · prazno = automatski`)}><${NumBox} id="grh" value=${band ? G[band].h : row.h} placeholder=${'auto (' + rowAx + ')'} step=${10} min=${0} onChange=${v => setRow({ h: v })} suffix="mm"/><//>
        </div>
        <div class="field"><span class="lbl">Otvaranje polja ${af + 1}</span>${openPicker(row.code || 'fix', code => setRow({ code }))}
          ${LC ? html`<span class=${cell.limitBad ? 'ferr' : 'fhint'}>${LC.name}: najmanje ${fN(LC.wMin)} × ${fN(LC.hMin)} mm · veće mere proverava statika (težina)</span>` : null}
        </div>
        <${Field} label="Ispuna polja"><${Seg} label="Ispuna" items=${[{ id: 'glass', label: 'Staklo' }, { id: 'panel', label: 'Panel' }]} value=${row.fill || 'glass'} onChange=${v => setRow({ fill: v })}/><//>
      </div>
      <${Field} label="Dekorativne prečke u staklu"><${Pills} items=${BARS} value=${pos.bars} onChange=${v => setP({ bars: v })}/><//>
    `;
  };

  return html`<div>${head}${presetModal}
  <div class="ed-grid">
    ${rail}
    <section style="min-width:0">
      <div class="card stage-card">
        <div class="stage-top">
          <span class="poz-tag">POZ. ${posIdx + 1}</span>
          <span class="type-chip" title=${TYPES[pos.type].hint}>${Icon.window(15)} ${TYPES[pos.type].label}</span>
          <input id="pname" class="inp" aria-label="Naziv pozicije" value=${pos.name} onInput=${e => setP({ name: e.target.value })}/>
          <${Seg} label="Pogled" items=${[{ id: 'in', label: 'Iznutra' }, { id: 'out', label: 'Spolja' }]} value=${ui.side} onChange=${v => set({ side: v })}/>
          <button class="ibtn" aria-label="Zatvori poziciju" title="Zatvori poziciju (Esc)" onClick=${() => set({ pid: '', af: -1 })}>${Icon.close()}</button>
        </div>
        <div class="dims-bar">
          <span class="lbl">Ukupne mere</span>
          <div class="dims-in">
            <label class="sr" for="totw">Ukupna širina</label><${TotalBox} id="totw" value=${pos.w} min=${LT.wMin} max=${LT.wMax} bad=${wBad} live=${!grid} onCommit=${v => upP(p => resizeTotal(p, 'w', v))}/>
            <span class="muted">×</span>
            <label class="sr" for="toth">Ukupna visina</label><${TotalBox} id="toth" value=${pos.h} min=${LT.hMin} max=${LT.hMax} bad=${hBad} live=${!grid} onCommit=${v => upP(p => resizeTotal(p, 'h', v))}/>
          </div>
          <span class="fhint">${grid ? 'Kolone i redovi sa upisanom merom se srazmerno prilagode, a „auto“ polja preuzmu razliku. Potvrdite sa Enter.' : `Dozvoljeno ${fN(LT.wMin)}–${fN(LT.wMax)} × ${fN(LT.hMin)}–${fN(LT.hMax)} mm`}</span>
        </div>
        <div class="stage" ref=${stageRef} onClick=${() => { if (ui.dim) set({ dim: null }); else if (af >= 0) set({ af: -1 }); }}>
          <div class="draw-tools" onClick=${e => e.stopPropagation()}>
            <button type="button" class=${'btn sm' + (ui.draw === 'v' ? ' primary' : '')} aria-pressed=${ui.draw === 'v'} title="Nacrtaj vertikalni stub preko polja" onClick=${() => set({ draw: ui.draw === 'v' ? null : 'v', dim: null })}>${Icon.splitV()} Stub</button>
            <button type="button" class=${'btn sm' + (ui.draw === 'h' ? ' primary' : '')} aria-pressed=${ui.draw === 'h'} title="Nacrtaj horizontalnu prečku preko polja" onClick=${() => set({ draw: ui.draw === 'h' ? null : 'h', dim: null })}>${Icon.splitH()} Prečka</button>
            ${ui.draw ? html`<span class="draw-hint">Kliknite gde ide ${ui.draw === 'v' ? 'stub' : 'prečka'} · Esc završava</span>` : null}
          </div>
          <${WindowSVG} p=${pos} P=${P} side=${ui.side} active=${af} showLimits=${!pos.override} onPick=${i => set(i === af ? { af: -1, dim: null } : { af: i, step: 1, dim: null })} onDim=${openDim} draw=${ui.draw ? { dir: ui.draw, onAdd: (x, y) => doBar(ui.draw, x, y) } : null} onMove=${moveField}/>
          ${ui.dim && ui.dim.pid === pos.id ? html`<${DimPop} key=${ui.dim.key} d=${ui.dim} onApply=${v => { if (applyDim(ui.dim.key, v)) set({ dim: null }); }} onClose=${() => set({ dim: null })}/>` : null}
        </div>
        <div class="stage-foot">
          <span><b>${ui.side === 'out' ? 'Pogled spolja' : 'Pogled iznutra'}</b> · ${(pick(P.colors, ui.side === 'out' ? pos.cOut : pos.cIn) || FALLBACK_COL).name}</span>
          <span>Klik na polje ga bira, prevlačenje ga premešta, klik na kotu menja meru, „Stub“ i „Prečka“ crtaju podelu.</span>
          <span class="legend"><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><path d="M21 1L1 6l20 5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>vrh trougla = šarke</span>
          <span class="legend"><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><path d="M1 1l10 10 10-10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2"/></svg>otklopno</span>
        </div>
        ${limErrs.length ? html`<div class=${'warns ' + (pos.override ? '' : 'err')} role="status">
          ${limErrs.map(w => html`<div>${Icon.warn()}<span>${w}</span></div>`)}
          ${gridFixes.length ? html`<div class="fixes">${gridFixes.map(fx => html`<div class="fix"><span>${fx.title}</span><div class="grid-tools">${fx.acts.map(a => html`<button class="btn sm" onClick=${a.fn}>${a.label}</button>`)}</div></div>`)}</div>` : null}
          <label class="chk" style="color:inherit;min-height:30px;margin-top:2px"><input type="checkbox" checked=${!!pos.override} onChange=${e => setP({ override: e.target.checked })}/><span>Mere su potvrđene sa proizvođačem, dozvoli izuzetak</span></label>
        </div>` : null}
        ${r.warnings.length ? html`<div class="warns" role="status">${r.warnings.map(w => html`<div>${Icon.warn()}<span>${w}</span></div>`)}
          ${statFixes.length ? html`<div class="fixes"><div class="fix"><span>Brza podela (stub ili prečka na sredini, mera se posle menja klikom na kotu):</span><div class="grid-tools">${statFixes.map(c => html`<button class="btn sm" onClick=${() => splitFix(c.k)}>${c.split === 'v' ? Icon.splitV() : Icon.splitH()} ${c.name}: ${c.split === 'v' ? 'dodaj stub' : 'dodaj prečku'}</button>`)}</div></div></div>` : null}
        </div>` : null}
      </div>
      <div class="below">
        <div class="card">
          <div class="card-h"><h2 class="h2">Obračun pozicije</h2><span class="mono muted" style="font-size:12px">${r.qty} × ${m(r.unit)}</span></div>
          <div class="card-b" style="padding-top:4px;padding-bottom:8px">
            ${r.lines.map(l => html`<div class="spec-row"><span style="font-size:13.5px">${l.label}</span><span class="mono" style="font-size:13px;text-align:right">${m(l.amt)}</span><span class="d">${l.detail}</span><span></span></div>`)}
            <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;gap:8px"><b>Ukupno pozicija (bez PDV)</b><span class="mono" style="font-size:16px;font-weight:500">${m(r.total)}</span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h2 class="h2">Tehnički podaci</h2></div>
          <div class="card-b">
            <div class="tech">
              <div><span>Površina</span><b>${f2(r.g.A)} m²</b></div>
              <div><span>Obim</span><b>${f2(r.g.per)} m</b></div>
              <div><span>${hasGlass ? 'Staklo (vidljivo)' : 'Panel ispuna'}</span><b>${f2(hasGlass ? r.g.Ag : r.g.Ap)} m²</b></div>
              <div><span>Uw procena</span><b>${f2(r.Uw)} W/m²K</b></div>
              <div><span>Ugradna dubina</span><b>${sys.depth} mm</b></div>
              <div><span>Komore</span><b>${sys.chambers}</b></div>
              <div><span>Uf profila</span><b>${f2(num(sys.uf, 0))}</b></div>
              <div><span>Ug stakla</span><b>${hasGlass ? f2(num(r.gl.ug, 0)) + ' · ' + r.gl.thick + ' mm' : '—'}</b></div>
              <div><span>Težina stakla</span><b>${hasGlass ? '≈ ' + Math.round(st.glassKg) + ' kg · ' + fN(st.gkg) + ' kg/m²' : '—'}</b></div>
              <div><span>Najteže krilo</span><b>${(() => { const o = st.cells.filter(c => c.open).sort((a, b) => b.kg - a.kg)[0]; return o ? '≈ ' + Math.round(o.kg) + ' / ' + fN(o.limKg) + ' kg' : 'nema krila'; })()}</b></div>
            </div>
            <p class="muted" style="margin:10px 0 0;font-size:11.5px">Uw je procena iz površina stakla i profila, nije zamena za proračun proizvođača.</p>
          </div>
        </div>
        <div class="card stat-card">
          <div class="card-h"><div><h2 class="h2">Statika i težina</h2><div class="muted" style="font-size:12.5px">${st.S.name}: krilo do ${fN(st.sKg)} kg${st.hwKg < num(st.S.sMaxKg, 0) ? ' (ograničava okov ' + st.hw.name + ')' : ''}, bočno krilo do ${fN(st.S.sRatio)}× šire nego visoko · stub i prečka do ${fN(st.S.mMax)} mm${hasGlass ? ` · ${st.gl.name}: ${fN(st.gkg)} kg/m², fiksno do ${fN(st.gMaxA)} m²` : ''}</div></div></div>
          <div class="tbl-wrap"><table class="tbl stat-tbl">
            <thead><tr><th>Element</th><th>Vrsta</th><th class="r">Mere, mm</th><th class="r">Staklo</th><th class="r">Težina</th><th>Statika</th></tr></thead>
            <tbody>
              ${st.cells.map(c => html`<tr class=${c.bad.length ? 'warn' : ''}>
                <td><b>${c.name}</b></td><td>${c.open ? (c.door ? 'krilo vrata' : 'krilo') : 'fiksno'}</td>
                <td class="r mono">${Math.round(c.w)} × ${Math.round(c.h)}</td><td class="r mono">${f2(c.gA)} m²</td>
                <td class="r mono">≈ ${Math.round(c.kg)} kg${c.limKg ? html`<span class="muted"> / ${fN(c.limKg)}</span>` : null}</td>
                <td>${c.bad.length ? html`<div class="stat-bad"><span>${c.bad.join('; ')}</span><button class="btn sm" onClick=${() => splitFix(c.k)}>${c.split === 'v' ? Icon.splitV() : Icon.splitH()} ${c.split === 'v' ? 'Dodaj stub' : 'Dodaj prečku'}</button></div>` : html`<span class="stat-ok">${Icon.check()} u granicama</span>`}</td>
              </tr>`)}
              ${st.mulls.map(m2 => html`<tr class=${m2.over ? 'warn' : ''}>
                <td><b>${m2.vert ? 'Stub' : 'Prečka'}</b></td><td>${m2.vert ? 'vertikalno' : 'horizontalno'}</td>
                <td class="r mono">${Math.round(m2.len)}</td><td class="r mono">—</td><td class="r mono">—</td>
                <td>${m2.over ? html`<span class="stat-warn">${Icon.warn()} duže od ${fN(st.S.mMax)} mm, ojačanje</span>` : html`<span class="stat-ok">${Icon.check()} u granicama</span>`}</td>
              </tr>`)}
            </tbody>
          </table></div>
          <p class="muted" style="margin:0;padding:10px 16px 14px;font-size:11.5px">Statika samo upozorava i ne blokira ponudu. Težina krila = m² stakla × kg/m² + profil krila. Granice podešavate u Cenovniku, prema tabelama proizvođača profila, okova i stakla.</p>
        </div>
      </div>
    </section>

    <section class="card cfg">
      <nav class="steps" aria-label="Koraci konfiguracije">
        ${STEPS.map((t, i) => { const off = i === 2 && !hasGlass; return html`<button type="button" class=${(step === i ? 'on' : '') + (off ? ' off' : '')} aria-current=${step === i ? 'step' : null} title=${off ? 'Pozicija nema staklenih polja' : ''} onClick=${() => set({ step: i })}><span class="n">${i + 1}</span><span class="t">${off ? 'Bez stakla' : t}</span></button>`; })}
      </nav>
      <div class="cfg-b">
        ${step === 0 ? html`
          <div class="type-box">
            <span class="type-chip">${Icon.window(15)} ${TYPES[pos.type].label}</span>
            <span class="fhint">${TYPES[pos.type].hint} Za drugi tip dodajte novu poziciju.</span>
          </div>
          <div class="grid2">
            <${Field} label="Širina" error=${wBad ? `Dozvoljeno ${fN(LT.wMin)}–${fN(LT.wMax)} mm` : ''} hint=${wBad ? '' : `${fN(LT.wMin)}–${fN(LT.wMax)} mm`}><${TotalBox} id="pw" value=${pos.w} min=${LT.wMin} max=${LT.wMax} bad=${wBad} live=${!grid} onCommit=${v => upP(p => resizeTotal(p, 'w', v))}/><//>
            <${Field} label="Visina" error=${hBad ? `Dozvoljeno ${fN(LT.hMin)}–${fN(LT.hMax)} mm` : ''} hint=${hBad ? '' : `${fN(LT.hMin)}–${fN(LT.hMax)} mm`}><${TotalBox} id="ph" value=${pos.h} min=${LT.hMin} max=${LT.hMax} bad=${hBad} live=${!grid} onCommit=${v => upP(p => resizeTotal(p, 'h', v))}/><//>
          </div>
          <div class="grid2">
            <${Field} label="Količina"><${NumBox} id="pq" value=${pos.qty} step=${1} min=${1} max=${999} steppers onChange=${v => setP({ qty: v })} suffix="kom"/><//>
            <${Field} label="Materijal"><${Seg} label="Materijal" items=${[{ id: 'PVC', label: 'PVC' }, { id: 'ALU', label: 'ALU' }]} value=${sys.mat} onChange=${mt => { const s = P.systems.find(x => x.mat === mt && num(x.depth, 0) === num(sys.depth, 0)) || P.systems.find(x => x.mat === mt); if (s) setP({ sys: s.id }); else notify('U cenovniku nema sistema za ' + mt + '.', 'bad'); }}/><//>
          </div>
          <${Field} label="Ugradna dubina profila"><${Pills} mono items=${depths.map(dp => ({ id: dp, label: dp + ' mm' }))} value=${num(sys.depth, 0)} onChange=${dp => { const s = P.systems.find(x => x.mat === sys.mat && num(x.depth, 0) === dp); if (s) setP({ sys: s.id }); }}/><//>
          <div class="field"><span class="lbl">Sistem profila</span>
            <div class="sys-list">${P.systems.filter(s => s.mat === sys.mat && num(s.depth, 0) === num(sys.depth, 0)).map(s => html`
              <button type="button" class=${'opt-card' + (s.id === sys.id ? ' on' : '')} aria-pressed=${s.id === sys.id} onClick=${() => setP({ sys: s.id })}>
                <span class="top"><span>${s.name}</span><span class="mono" style="font-weight:500;font-size:12.5px">${fN(s.ppm)} €/m²</span></span>
                <span class="sub">${s.depth} mm · ${s.chambers} · Uf ${f2(num(s.uf, 0))}</span>

function TableEd({ rows, cols, onCell, onAdd, onDel, addLabel, minRows = 1 }) {
  const cell = (c, r, i) => {
    const v = r[c.key];
    if (c.type === 'num') return html`<${NumBox} value=${v} step=${c.step || 1} onChange=${x => onCell(i, c.key, x)} suffix=${c.suf}/>`;
    if (c.type === 'sel') return html`<select class="sel" value=${v} onChange=${e => onCell(i, c.key, e.target.value)}>${c.opts.map(x => html`<option value=${x}>${x}</option>`)}</select>`;
    if (c.type === 'chk') return html`<input type="checkbox" style="width:18px;height:18px;accent-color:var(--accent)" checked=${!!v} onChange=${e => onCell(i, c.key, e.target.checked)} aria-label=${c.label}/>`;
    if (c.type === 'color') return html`<span style="display:flex;gap:6px;align-items:center"><input type="color" value=${v} onInput=${e => onCell(i, c.key, e.target.value)} style="width:34px;height:34px;border:0;padding:0;background:transparent" aria-label="Boja"/><span class="mono muted" style="font-size:11.5px">${v}</span></span>`;
    if (c.type === 'ro') return html`<b style="font-size:13px">${v}</b>`;
    return html`<input class="inp" value=${v} onInput=${e => onCell(i, c.key, e.target.value)} aria-label=${c.label}/>`;
  };
  return html`<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${cols.map(c => html`<th style=${c.w ? `width:${c.w}` : ''}>${c.label}</th>`)}${onDel ? html`<th style="width:44px"></th>` : null}</tr></thead>
    <tbody>${rows.map((r, i) => html`<tr key=${r.id}>${cols.map(c => html`<td>${cell(c, r, i)}</td>`)}${onDel ? html`<td>${rows.length > minRows ? html`<button class="ibtn warn" aria-label="Obriši red" onClick=${() => onDel(i)}>${Icon.trash()}</button>` : null}</td>` : null}</tr>`)}</tbody>
  </table></div>
  ${onAdd ? html`<div style="padding:10px 12px"><button class="btn sm" onClick=${onAdd}>${Icon.plus()} ${addLabel}</button></div>` : null}`;
}
function KV({ obj, items, onSet }) {
  return html`<div class="kv">${items.map(([k, label, suf, step]) => html`<${Field} label=${label}><${NumBox} value=${obj[k]} step=${step || 1} onChange=${v => onSet(k, v)} suffix=${suf}/><//>`)}</div>`;
}

};
const loadedFonts = new Set(['Manrope:wght@400;500;600;700', 'Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700']);
function loadFonts(list) {
  const need = list.filter(x => x && !loadedFonts.has(x));
  if (!need.length) return;
  need.forEach(x => loadedFonts.add(x));
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + need.map(x => 'family=' + x).join('&') + '&display=swap';
  document.head.appendChild(l);
}
const HOST_THEME = (typeof document !== 'undefined' && document.documentElement && document.documentElement.getAttribute) ? document.documentElement.getAttribute('data-theme') : null;
function applyUi(ui) {
  const root = document.documentElement, st = root.style;
  if (ui.theme === 'light' || ui.theme === 'dark') root.setAttribute('data-theme', ui.theme);
  else if (HOST_THEME) root.setAttribute('data-theme', HOST_THEME); else root.removeAttribute('data-theme');
  const body = FONTS[ui.font] || FONTS.manrope, head = HEADINGS[ui.heading] || HEADINGS.bricolage;
  loadFonts([body.gf, head.gf]);
  const bodyCss = body.css + ",system-ui,-apple-system,'Segoe UI',sans-serif";
  const headCss = (head.css || body.css) + ',' + bodyCss;
  st.setProperty('--f-body', bodyCss);
  st.setProperty('--f-display', headCss);
  st.setProperty('--f-pdf', ui.pdfFont ? body.css : "'Manrope'");
  st.setProperty('--f-pdf-display', ui.pdfFont ? (head.css || body.css) : "'Bricolage Grotesque'");
}
function applyBrand(hex) {

  r.setProperty('--accent-soft', rgba(hex, 0.11));
  r.setProperty('--accent-ink', L > 0.45 ? '#121820' : '#FFFFFF');
  r.setProperty('--accent-t-light', L > 0.3 ? mix(hex, '#000000', 0.4) : hex);
  r.setProperty('--accent-t-dark', L < 0.18 ? mix(hex, '#FFFFFF', 0.5) : hex);
}
function App() {

  const THEMES = [['light', 'Svetla tema', Icon.sun], ['dark', 'Tamna tema', Icon.moon], ['system', 'Tema kao na računaru', Icon.auto]];
  const curTheme = THEMES.find(t => t[0] === ui.theme) || THEMES[2];
  const nextTheme = () => { const i = THEMES.findIndex(t => t[0] === ui.theme); const n = THEMES[(i + 1) % 3][0]; update(d => { d.settings.ui = Object.assign({}, defaultSettings().ui, d.settings.ui, { theme: n }); }); notify(THEMES.find(t => t[0] === n)[1]); };
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.action ? 7000 : 3200); return () => clearTimeout(t); }, [toast]);
  const update = fn => setData(d => { const n = clone(d); fn(n); return n; });
  const notify = (msg, kind, action) => setToast({ msg, kind, action, k: Math.random() });
  const go = r => { setRoute(r); try { window.scrollTo(0, 0); } catch (e) { } };
  const newOffer = () => { let id; update(d => { const o = makeOffer(d); id = o.id; d.offers.unshift(o); }); setTimeout(() => go({ view: 'editor', offerId: id }), 0); };
  const exportPdf = offerId => {
    if (job) return;
    const o = data.offers.find(x => x.id === offerId);
    if (!o) return;
    const bad = offerErrors(o, data);
    if (bad.length) {
      notify(`Pozicija ${bad.map(b => b.i + 1).join(', ')}: mere su van dozvoljenih granica. Ispravite ih ili na poziciji potvrdite izuzetak.`, 'bad');
      return;
    }
    setJob({ offerId });
  };
  const onPdfDone = res => {
    setJob(null);
    if (!res.ok) { notify(res.err, 'bad'); return; }
    if (res.res !== 'saved') { if (res.res === 'busy') notify('Sačekajte da se završi prethodno preuzimanje.'); return; }
    const o = data.offers.find(x => x.id === res.offerId);
    if (o && o.status === 'nacrt') notify('PDF je preuzet.', null, { label: 'Označi kao poslatu', fn: () => update(d => { const x = d.offers.find(y => y.id === res.offerId); if (x) { x.snap = x.snap || clone(d.prices); x.status = 'poslata'; } }) });
    else notify('PDF je preuzet.');
  };
  const C = data.settings.company;
  const nav = [['dash', 'Pregled', Icon.home], ['offers', 'Ponude', Icon.file], ['prices', 'Cenovnik', Icon.tag], ['settings', 'Podešavanja', Icon.gear]];
  const view = route.view;
  return html`<div class=${'shell' + (view === 'editor' ? ' compact' : '')}>
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">${C.logo ? html`<img src=${C.logo} alt=""/>` : initials(C.name)}</div>
        <div class="brand-txt"><div class="brand-name">${C.name}</div><div class="brand-sub">Kalkulator ponuda</div></div>
      </div>
      <button class="btn primary cta" onClick=${newOffer} title="Nova ponuda">${Icon.plus()}<span class="lbl-t">Nova ponuda</span></button>
      <nav class="nav" aria-label="Glavna navigacija">
        ${nav.map(([k, l, ic]) => html`<button class=${(view === k || (k === 'offers' && view === 'editor')) ? 'on' : ''} onClick=${() => go({ view: k })} title=${l} aria-label=${l}>${ic()}<span class="lbl-t">${l}</span></button>`)}
      </nav>
      <button class="theme-btn" onClick=${nextTheme} title=${curTheme[1] + ' · klik za promenu'} aria-label=${curTheme[1] + ', promeni temu'}>${curTheme[2]()}<span class="lbl-t">${curTheme[1]}</span></button>
      <div class="side-foot">
        <span><span class=${'dot' + (saved ? '' : ' fail')}></span>${saved ? 'Sve izmene su sačuvane' : 'Čuvanje nije uspelo'}</span>
        <span>Podaci se čuvaju u ovom pregledaču. Rezervna kopija: Podešavanja.</span>
      </div>
    </aside>
    <main class="main">
      ${view === 'dash' ? html`<${Dashboard} data=${data} go=${go} newOffer=${newOffer}/>` : null}
      ${view === 'offers' ? html`<${Offers} data=${data} update=${update} go=${go} newOffer=${newOffer} exportPdf=${exportPdf} notify=${notify}/>` : null}
      ${view === 'editor' ? html`<${Editor} key=${route.offerId} data=${data} update=${update} offerId=${route.offerId} go=${go} notify=${notify} exportPdf=${exportPdf}/>` : null}
      ${view === 'prices' ? html`<${Prices} data=${data} update=${update}/>` : null}
      ${view === 'settings' ? html`<${Settings} data=${data} update=${update} notify=${notify} setData=${setData}/>` : null}
    </main>
    ${job ? html`<${PdfCapture} job=${job} data=${data} onDone=${r => { setProg(null); onPdfDone(r); }} onProgress=${(a, b) => setProg([a, b])}/><div class="busy" role="status"><div><span class="spin"></span>Pravim PDF ponude…${prog ? html`<span class="mono muted" style="font-weight:500">strana ${prog[0]} od ${prog[1]}</span>` : null}</div></div>` : null}
    ${toast ? html`<div class=${'toast' + (toast.kind === 'bad' ? ' bad' : '')} role="status" key=${toast.k}>
      <span>${toast.msg}</span>
      ${toast.action ? html`<button class="btn sm" onClick=${() => { toast.action.fn(); setToast(null); }}>${toast.action.label}</button>` : null}
    </div>` : null}
  </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
</script>
</body></html>
