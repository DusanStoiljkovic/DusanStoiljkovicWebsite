/* ───────────── cenovnik ───────────── */
function TableEd({ rows, cols, onCell, onAdd, onDel, addLabel, minRows = 1 }) {
  const cell = (c, r, i) => {
    const v = r[c.key];
    if (c.type === 'num') return html`<${NumBox} value=${v} step=${c.step || 1} onChange=${x => onCell(i, c.key, x)} suffix=${c.suf}/>`;
    if (c.type === 'sel') return html`<select class="sel" value=${v} onChange=${e => onCell(i, c.key, e.target.value)}>${c.opts.map(x => html`<option value=${x}>${x}</option>`)}</select>`;
    if (c.type === 'chk') return html`<input type="checkbox" style="width:18px;height:18px;accent-color:var(--accent)" checked=${!!v} onChange=${e => onCell(i, c.key, e.target.checked)} aria-label=${c.label}/>`;
    if (c.type === 'color') return html`<span style="display:flex;gap:6px;align-items:center"><input type="color" value=${v} onInput=${e => onCell(i, c.key, e.target.value)} style="width:34px;height:34px;border:0;padding:0;background:transparent" aria-label="Boja"/><span class="mono muted" style="font-size:11.5px">${v}</span></span>`;
    if (c.type === 'ro') return html`<b style="font-size:13px">${v}</b>`;
    return html`<input class="inp" value=${v} onInput=${e => onCell(i, c.key, e.target.value)} aria-label=${c.label}/>`;
  };
  return html`<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${cols.map(c => html`<th style=${c.w ? `width:${c.w}` : ''}>${c.label}</th>`)}${onDel ? html`<th style="width:44px"></th>` : null}</tr></thead>
    <tbody>${rows.map((r, i) => html`<tr key=${r.id}>${cols.map(c => html`<td>${cell(c, r, i)}</td>`)}${onDel ? html`<td>${rows.length > minRows ? html`<button class="ibtn warn" aria-label="Obriši red" onClick=${() => onDel(i)}>${Icon.trash()}</button>` : null}</td>` : null}</tr>`)}</tbody>
  </table></div>
  ${onAdd ? html`<div style="padding:10px 12px"><button class="btn sm" onClick=${onAdd}>${Icon.plus()} ${addLabel}</button></div>` : null}`;
}
function KV({ obj, items, onSet }) {
  return html`<div class="kv">${items.map(([k, label, suf, step]) => html`<${Field} label=${label}><${NumBox} value=${obj[k]} step=${step || 1} onChange=${v => onSet(k, v)} suffix=${suf}/><//>`)}</div>`;
}

const HEADINGS = {

  dmserif: { name: 'DM Serif Display', css: "'DM Serif Display'", gf: 'DM+Serif+Display' }
};
const loadedFonts = new Set(['Bricolage+Grotesque:opsz,wght@12..96,400..800']);
function loadFonts(list) {
  const need = list.filter(x => x && !loadedFonts.has(x));
  if (!need.length) return;
  need.forEach(x => loadedFonts.add(x));
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + need.map(x => 'family=' + x).join('&') + '&display=swap';
  document.head.appendChild(l);
}
const HOST_THEME = (typeof document !== 'undefined' && document.documentElement && document.documentElement.getAttribute) ? document.documentElement.getAttribute('data-theme') : null;
function applyUi(ui) {
  const root = document.documentElement, st = root.style;
  if (ui.theme === 'light' || ui.theme === 'dark') root.setAttribute('data-theme', ui.theme);
  else if (HOST_THEME) root.setAttribute('data-theme', HOST_THEME); else root.removeAttribute('data-theme');
  const body = FONTS[ui.font] || FONTS.bricolage, head = HEADINGS[ui.heading] || HEADINGS.same;
  loadFonts([body.gf, head.gf]);
  const bodyCss = body.css + ",system-ui,-apple-system,'Segoe UI',sans-serif";
  const headCss = (head.css || body.css) + ',' + bodyCss;
  st.setProperty('--f-body', bodyCss);
  st.setProperty('--f-display', headCss);
  st.setProperty('--f-pdf', ui.pdfFont ? body.css : "'Bricolage Grotesque'");
  st.setProperty('--f-pdf-display', ui.pdfFont ? (head.css || body.css) : "'Bricolage Grotesque'");
}
function applyBrand(hex) {
  const r = document.documentElement.style;
  const L = lum(hex);
  // svetao akcent nosi tamno mastilo (kao limeta u dizajnu); taman akcent nosi belo
  r.setProperty('--acc', hex);
  r.setProperty('--acc-ink', L > 0.4 ? '#142019' : '#FFFFFF');
  r.setProperty('--acc-soft', rgba(hex, L > 0.4 ? 0.22 : 0.12));
  r.setProperty('--acc-t-dk', L < 0.18 ? mix(hex, '#FFFFFF', 0.5) : hex);
}

      ${view === 'settings' ? html`<${Settings} data=${data} update=${update} notify=${notify} setData=${setData}/>` : null}
    </main>
    ${job ? html`<${PdfCapture} job=${job} data=${data} onDone=${r => { setProg(null); onPdfDone(r); }} onProgress=${(a, b) => setProg([a, b])}/><div class="busy" role="status"><div><span class="spin"></span>Pravim PDF ponude…${prog ? html`<span class="hint" style="font-weight:500">strana ${prog[0]} od ${prog[1]}</span>` : null}</div></div>` : null}
    ${toast ? html`<div class=${'toast' + (toast.kind === 'bad' ? ' bad' : '')} role="status" key=${toast.k}>
      <span>${toast.msg}</span>
      ${toast.action ? html`<button class="btn btn-acc sm" onClick=${() => { toast.action.fn(); setToast(null); }}>${toast.action.label}</button>` : null}
    </div>` : null}
  </div></div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
</script>
</body></html>
